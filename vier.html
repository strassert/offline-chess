let myId=null;
try{
  myId=sessionStorage.getItem('vierId');
  if(!myId){ myId='p'+Math.random().toString(36).slice(2,8);
             sessionStorage.setItem('vierId',myId); }
}catch(e){ myId='p'+Math.random().toString(36).slice(2,8); }

const lobbyEl=document.getElementById('lobby');
const leaveBtn=document.getElementById('leaveBtn');
let lobbyMsg='';

function seatFree(col){ return !seats[col] || seats[col]===myId; }
function showLobby(){ if(lobbyEl) lobbyEl.classList.add('on'); renderLobby(); refreshHist(); }
function hideLobby(){ if(lobbyEl) lobbyEl.classList.remove('on'); }
// Die Lobby bleibt offen, bis die Partie läuft: Spieler warten dort auf den
// Gegner und stellen bis zum Start noch die Bedenkzeit ein.
function syncLobby(){
  if(!Sync.transport) return;
  const offen = reviewIdx===null &&
    ((mySide===null)||((mySide==='r'||mySide==='g')&&phase==='setup'));
  if(offen) showLobby(); else hideLobby();
}
function renderLobby(){
  if(!lobbyEl) return;
  const bereit=Sync.ready;
  for(const col of ['r','g']){
    const btn=document.getElementById('seat'+col.toUpperCase());
    if(!btn) continue;
    const meiner=seats[col]===myId, belegt=seats[col]&&!meiner;
    btn.disabled=!!belegt||!bereit;
    btn.classList.toggle('on',meiner);
    btn.querySelector('.who').textContent =
      meiner?'du':(belegt?(names[col]||'besetzt'):'frei');
  }
  for(const b of document.querySelectorAll('#tcRow .tc')) b.disabled=!bereit;
  const rs=document.getElementById('resetSeats'); if(rs) rs.disabled=!bereit;

  const sitzt=(mySide==='r'||mySide==='g');
  const beide=!!(seats.r&&seats.g);
  const start=document.getElementById('lobbyStart');
  if(start){
    start.style.display=sitzt?'block':'none';
    start.disabled=!beide||!bereit;
    start.textContent=beide?'Spiel starten':'Warte auf Gegner …';
  }
  const lv=document.getElementById('lobbyLeave');
  if(lv) lv.style.display=sitzt?'block':'none';
  const sv=document.getElementById('seatV');
  if(sv) sv.style.display=sitzt?'none':'block';
  const step=document.getElementById('lobbyStep');
  if(step) step.textContent = sitzt
    ? (beide?'Bereit – Bedenkzeit prüfen und starten':'Warte auf den zweiten Spieler')
    : 'Name, Farbe und Bedenkzeit wählen';
  const m=document.getElementById('lobbyMsg');
  if(m) m.textContent=bereit?lobbyMsg:('Verbinde mit '+(Net.mode||'der Gegenstelle')+' …');
  renderHist();
  if(leaveBtn){
    leaveBtn.style.display=(mySide==='v')?'block':'none';
    leaveBtn.textContent='Platz wählen';
  }
}
function applySide(){
  const sub=document.querySelector('.sub');
  if(sub) sub.textContent = mySide==='r' ? 'Du spielst Rot'
                          : mySide==='g' ? 'Du spielst Gelb'
                          : mySide==='v' ? 'Zuschauer'
                          : 'Zwei PCs · ein Brett';
  const verstecken=(mySide==='v');
  for(const id of ['newBtn','undoBtn']){
    const b=document.getElementById(id); if(b) b.style.display=verstecken?'none':'block';
  }
  render(); renderLobby(); renderPlayers();
}
function myName(){
  const el=document.getElementById('nameInput');
  const n=clean(el&&el.value);
  if(n){ try{ sessionStorage.setItem('vierName',n); }catch(e){} }
  return n;
}
function dropMe(){
  const vorher=specs.length;
  specs=specs.filter(s=>s.id!==myId);
  // Wer nur in der Zahl steckte, muss auch daraus verschwinden
  if(specs.length===vorher && specPlus>0) specPlus--;
}
function takeSeat(col){
  if(!seatFree(col)){ lobbyMsg='Platz ist bereits belegt.'; renderLobby(); return; }
  const n=myName();
  if(!n){ lobbyMsg='Bitte zuerst einen Namen eingeben.'; renderLobby(); return; }
  dropMe();
  // Wechselt jemand die Farbe, wird der bisherige Platz frei
  const andere=gegner(col);
  if(seats[andere]===myId){ seats[andere]=''; names[andere]=''; }
  seats[col]=myId; names[col]=n; mySide=col; lobbyMsg='';
  // Sitzt der Gegner noch in einer laufenden Partie, wird sie übernommen
  const uebernahme = phase==='run' && !!seats[gegner(col)];
  if(!uebernahme){
    neuesSpielStill(); phase='setup'; result='';
    const b=tcParts().base; clock={r:b,g:b}; clockAt=Date.now();
  }
  Sync.publish();
  applySide(); syncLobby();
  setTimeout(()=>{
    if(mySide===col && seats[col]!==myId){
      lobbyMsg='Ein anderer Spieler war schneller.'; leaveSeat(true);
    }
  },2500);
}
function watchOnly(){
  const n=myName();
  if(!n){ lobbyMsg='Bitte zuerst einen Namen eingeben.'; renderLobby(); return; }
  dropMe();
  if(specs.length<MAXSPECS) specs.push({id:myId,name:n}); else specPlus++;
  mySide='v'; lobbyMsg=''; Sync.publish(); applySide(); syncLobby();
}
function leaveSeat(verloren){
  if(mySide==='r'||mySide==='g'){
    if(seats[mySide]===myId){ seats[mySide]=''; names[mySide]='';
                              if(!verloren) Sync.publish(); }
  } else if(mySide==='v'){ dropMe(); Sync.publish(); }
  mySide=null; applySide(); syncLobby();
}
function resetSeats(){
  seats.r=''; seats.g=''; names.r=''; names.g=''; specs=[]; specPlus=0;
  neuesSpielStill(); phase='setup'; result='';
  const b=tcParts().base; clock={r:b,g:b}; clockAt=Date.now();
  lobbyMsg=''; Sync.publish(); render(); renderLobby(); renderPlayers();
}

/* ---------- PLC-Transport (zwei PCs, ein Brett) ----------
   Synchronisiert über eine STRING-Variable der Steuerung, gelesen/geschrieben
   über den B&R-AR-Webserver (goform/ReadWrite). Voraussetzung: response.asp
   liegt im Webverzeichnis. Aktivierung mit ?plc; PV-Name via ?pv=...
   (Vorgabe gVierState) - eine eigene Variable, damit Schach und Vier gewinnt
   sich nicht gegenseitig überschreiben. */
function setupPLC(){
  const params=new URLSearchParams(location.search);
  const pv=params.get('pv')||'gVierState';
  const G='/goform/ReadWrite';
  const body=(tail)=>'redirect=/response.asp&variable='+encodeURIComponent(pv)+tail;
  function post(data,ms){ return fetchT(G,{method:'POST',body:data},ms); }
  /* Schreiben mit Wiederholung: Solange etwas aussteht, wird kein empfangener
     Stand übernommen - er wäre älter als das, was wir senden. Gesendet wird
     dabei immer der JETZIGE Stand, nicht der beim Vormerken eingefrorene. */
  let pending=null, sending=false, retry=null, pendingSince=0;
  let stamp=0, sendingSince=0;
  let wrote='', cutSeen=0;
  const holdsBack=()=>pending!==null && Date.now()-pendingSince<10000;
  async function flush(){
    if(sending||pending===null) return;
    sending=true; sendingSince=Date.now();
    const at=stamp;
    let val; try{ val=serializeState(); }catch(e){ val=pending; }
    try{
      const r=await post(body('&value='+encodeURIComponent(val)+'&write=1'),6000);
      if(!r.ok) throw new Error('Schreiben '+r.status);
      if(stamp===at) pending=null;
      Sync.last=val; wrote=val; Sync.fails=0; Net.writeOk();
    }catch(e){ Sync.fails++; Net.writeFail(); }
    finally{
      sending=false;
      Net.queued=pending===null?0:pendingSince;
      try{ renderWarn(); }catch(e){}
      if(pending!==null){
        clearTimeout(retry);
        retry=setTimeout(flush,Math.min(4000,400*Math.pow(2,Math.min(Sync.fails,3))));
      }
    }
  }
  function write(val){
    if(pending===null){ pendingSince=Date.now(); Net.queued=pendingSince; }
    pending=val; stamp++; flush();
  }
  async function read(){
    const t0=Date.now();
    let r;
    try{ r=await post(body('&value=none&read=1'),4000); }
    catch(e){ Net.readFail(); throw e; }
    if(!r.ok){ Net.readFail(); throw new Error('Lesen '+r.status); }
    const t=(await r.text()).replace('<!-- B&R ASP Webserver -->','').trim();
    if(t.indexOf('<')>=0){ Net.readFail(); throw new Error('Antwort ist keine Variable'); }
    Net.readOk(Date.now()-t0);
    return t;
  }
  Sync.transport={ send:write, confirms:true };
  Sync.ready=false;          // bis zum ersten Abgleich nichts überschreiben

  const hpv=params.get('hpv')||'gVierHist';
  const hbody=(tail)=>'redirect=/response.asp&variable='+encodeURIComponent(hpv)+tail;
  Hist.load=async()=>{
    const r=await fetchT(G,{method:'POST',body:hbody('&value=none&read=1')},6000);
    if(!r.ok) throw new Error('Lesen '+r.status);
    return (await r.text()).replace('<!-- B&R ASP Webserver -->','').trim();
  };
  Hist.save=async(val)=>{
    const r=await fetchT(G,{method:'POST',
      body:hbody('&value='+encodeURIComponent(val)+'&write=1')},6000);
    if(!r.ok) throw new Error('Schreiben '+r.status);
  };
  Hist.name=hpv;
  Hist.hint='Variable '+hpv+' auf der Steuerung anlegen (STRING[2000], remanent).';

  const side=(params.get('side')||'').toLowerCase().charAt(0);
  applySide(); showLobby();

  let busy=false, busySince=0;
  async function poll(){
    if(busy) return;
    busy=true; busySince=Date.now();
    try{
      const remote=await read();
      Sync.fails=0;
      /* Kommt der eigene Stand zeichengenau gekürzt zurück, ist nicht die
         Leitung schuld: Der Webserver bestätigt das Schreiben, abgelegt wird
         aber nur, was hineinpasst. Ohne diese Prüfung sieht es aus wie ein
         veralteter Gegenstand, und beide Seiten überschreiben sich endlos. */
      /* Ist die Antwort zeichengenau ein Anfangsstück dessen, was wir selbst
         geschrieben haben, ist es unser eigener, unterwegs gekürzter Stand.
         Den darf man nie übernehmen - sonst verliert man die eigenen Züge an
         den Webserver, der sie gerade abgeschnitten hat. */
      const eigenGekuerzt=!!(wrote && remote.length<wrote.length &&
                             wrote.indexOf(remote)===0);
      if(eigenGekuerzt){
        if(++cutSeen>=2){
          Net.cut={pv:pv, cap:remote.length, need:wrote.length};
          /* Jetzt ist die wirkliche Obergrenze bekannt. Der kürzere Stand muss
             sofort raus - nicht über Sync.again(), das hält Abstand und würde
             hier womöglich gar nichts senden. Drüben stünde sonst weiterhin
             der abgeschnittene Stand, und das Spiel bliebe stehen. */
          if(remote.length>=100 && WIRE_MAX>remote.length-8){
            WIRE_MAX=remote.length-8;
            wrote='';                       // sonst gilt der alte Vergleich weiter
            Sync.wieder();
          }
        }
      } else { cutSeen=0; Net.cut=null; }
      if(!eigenGekuerzt && !holdsBack() && acceptState(remote)){
        if(Sync.ready && outdated(remote)){
          if(!Net.cut) Sync.again();
        } else if(!Sync.ready){
          Sync.last=remote;
          applyState(parseState(remote));
          Sync.ready=true;
          try{ renderLobby(); }catch(e){}
          if(side==='r'||side==='g') takeSeat(side);
          else if(side==='v') watchOnly();
        } else if(remote!==Sync.last){ Sync.receive(remote); }
      }
    }catch(e){ Sync.fails++; }
    finally{
      busy=false;
      try{ renderWarn(); }catch(e){}
    }
  }
  /* Bei Störungen Abstand halten. Die Kette darf dabei nie abreißen: ein
     einziger Fehler ohne .catch würde die Abfrage dauerhaft beenden. */
  let lastTry=0, timer=null;
  function loop(){
    lastTry=Date.now();
    poll().catch(()=>{}).then(()=>{
      const wait=Sync.fails?Math.min(5000,1000*Math.pow(2,Math.min(Sync.fails,3))):1000;
      clearTimeout(timer); timer=setTimeout(loop,wait);
    });
  }
  loop();
  /* Wachhund: läuft unabhängig von der Kette und löst notfalls hängende
     Sperren - bliebe ein Zugriff offen, wäre der Abgleich sonst für immer aus. */
  setInterval(()=>{
    const now=Date.now();
    if(busy && now-busySince>15000) busy=false;
    if(sending && now-sendingSince>15000) sending=false;
    if(!busy && now-lastTry>8000){ clearTimeout(timer); loop(); }
    if(pending!==null && !sending) flush();
    try{ reconcile(); }catch(e){}
  },5000);
  setInterval(renderNet,1000);
  Net.mode='Steuerung';
  Net.reconnect=()=>{
    Sync.fails=0; clearTimeout(timer); clearTimeout(retry);
    busy=false; sending=false;
    loop(); if(pending!==null) flush(); refreshHist(true);
  };
}

/* ---------- Server-Transport ----------
   Zwei Gegenstellen: der Node-Server (schiebt Änderungen per Ereignisstrom)
   und die PHP-Fassung für klassisches Webhosting (wird abgefragt). Welche
   vorhanden ist, ermittelt detectApi(). Der Parameter spiel=vier hält den
   Spielstand von dem des Schachs getrennt. */
const Api={base:'',ext:'',sse:true};
const RAUM='vier';
function apiUrl(name){ return Api.base+'api/'+name+Api.ext+'?spiel='+RAUM; }
async function detectApi(){
  const dir=location.pathname.replace(/[^/]*$/,'');   // erlaubt Unterordner
  for(const c of [{ext:'',sse:true},{ext:'.php',sse:false}]){
    try{
      const r=await fetch(dir+'api/health'+c.ext,{cache:'no-store'});
      if(!r.ok) continue;
      let j={}; try{ j=await r.json(); }catch(e){}
      Api.base=dir; Api.ext=c.ext; Api.sse=c.sse&&j.backend!=='php';
      return true;
    }catch(e){}
  }
  return false;
}
function setupServer(){
  let pending=null, sending=false, retry=null, pendingSince=0;
  let stamp=0, sendingSince=0;
  const holdsBack=()=>pending!==null && Date.now()-pendingSince<10000;
  async function flush(){
    if(sending||pending===null) return;
    sending=true; sendingSince=Date.now();
    const at=stamp;
    let val; try{ val=serializeState(); }catch(e){ val=pending; }
    try{
      const r=await fetchT(apiUrl('state'),{method:'POST',
        headers:{'Content-Type':'text/plain'},body:val},6000);
      if(!r.ok) throw new Error('Schreiben '+r.status);
      if(stamp===at) pending=null;
      Sync.last=val; Sync.fails=0; Net.writeOk();
    }catch(e){ Sync.fails++; Net.writeFail(); }
    sending=false;
    Net.queued=pending===null?0:pendingSince;
    try{ renderWarn(); }catch(e){}
    if(pending!==null){
      clearTimeout(retry);
      retry=setTimeout(flush,Math.min(4000,400*Math.pow(2,Math.min(Sync.fails,3))));
    }
  }
  Sync.transport={ send:(val)=>{
      if(pending===null){ pendingSince=Date.now(); Net.queued=pendingSince; }
      pending=val; stamp++; flush(); }, confirms:true };
  Sync.ready=false;

  Hist.load=async()=>{
    const r=await fetchT(apiUrl('hist'),{cache:'no-store'},6000);
    if(!r.ok) throw new Error('Lesen '+r.status);
    return (await r.json()).s;
  };
  Hist.save=async(val)=>{
    const r=await fetchT(apiUrl('hist'),
      {method:'POST',headers:{'Content-Type':'text/plain'},body:val},6000);
    if(!r.ok) throw new Error('Schreiben '+r.status);
  };
  Hist.name=apiUrl('hist');
  Hist.hint=Api.ext==='.php'
    ? 'Auf dem Webspace fehlt api/hist.php, oder der Ordner api ist nicht '+
      'beschreibbar (api/health.php muss "writable":true melden).'
    : 'Der Server beantwortet /api/hist nicht - läuft dort die aktuelle Fassung?';
  applySide(); showLobby();

  function apply(txt){
    if(holdsBack()) return;
    if(!acceptState(txt)) return;
    if(Sync.ready && outdated(txt)){ Sync.again(); return; }
    if(!Sync.ready){
      Sync.last=txt; applyState(parseState(txt));
      Sync.ready=true; renderLobby();
    } else if(txt!==Sync.last){ Sync.receive(txt); }
  }
  let live=false, es=null, lastEvt=0, reopen=null;
  function openStream(){
    if(!Api.sse) return;
    clearTimeout(reopen);
    try{ if(es) es.close(); }catch(e){}
    lastEvt=Date.now();
    try{
      es=new EventSource(apiUrl('events'));
      es.onmessage=(e)=>{ live=true; lastEvt=Date.now(); Net.readOk(Net.avg||20);
                          try{ apply(JSON.parse(e.data).s); }catch(err){} };
      es.onerror=()=>{ live=false;
                       clearTimeout(reopen); reopen=setTimeout(openStream,5000); };
    }catch(e){}
  }
  openStream();
  async function poll(){
    if(live&&Sync.ready) return;
    try{
      const t0=Date.now();
      const r=await fetchT(apiUrl('state'),{cache:'no-store'},4000);
      if(!r.ok) throw new Error('Lesen '+r.status);
      apply((await r.json()).s);
      Sync.fails=0; Net.readOk(Date.now()-t0);
    }catch(e){ Sync.fails++; Net.readFail(); }
    finally{ try{ renderWarn(); }catch(e){} }
  }
  const tick=()=>{ try{ poll().catch(()=>{}); }catch(e){} };
  tick();
  setInterval(tick,Api.sse?3000:1000);     // ohne Ereignisstrom öfter nachsehen
  setInterval(()=>{
    if(sending && Date.now()-sendingSince>15000) sending=false;
    if(pending!==null && !sending) flush();
    if(Api.sse && Date.now()-lastEvt>40000){ live=false; openStream(); }
    try{ reconcile(); }catch(e){}
  },5000);
  setInterval(renderNet,1000);
  Net.mode='Server';
  Net.reconnect=()=>{
    Sync.fails=0; sending=false;
    openStream(); tick(); if(pending!==null) flush(); refreshHist(true);
  };
}

   anspringen und aus dem Alleinspiel eine Lobby machen. */
if(_q.indexOf('solo')>=0){
  /* nichts einrichten - Alleinbetrieb */
} else if(_q.indexOf('plc')>=0){
  setupPLC();
} else if(_q.indexOf('srv')>=0){
  setupServer();
} else if(_q.indexOf('demo')>=0 && 'BroadcastChannel' in window){
  const bc=new BroadcastChannel('vier-sync');
  Sync.transport={ send:(s)=>bc.postMessage(s) };
  bc.onmessage=(e)=>Sync.receive(e.data);
  applySide(); showLobby();
} else if(location.protocol!=='file:'){
  const fertig=(gefunden)=>{
    erkennungLaeuft=false;
    if(gefunden) setupServer();
    else { renderGegner(); kiPlanen(); }      // niemand da: dann eben allein
  };
  detectApi().then(fertig).catch(()=>fertig(false));
}
</script>
</body>
</html>

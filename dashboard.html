<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Seekirchen</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#20232a">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seekirchen">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#20232a; --card:#2b2f38; --card2:#1c1f26; --text:#f2efe7;
    --accent:#6fae5f; --warn:#f0c14b; --bad:#ff6b6b; --cold:#7fb6ff; --hot:#ff9a5b;
    --line:#3a3f4a; --pad:clamp(14px,3vw,28px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:Segoe UI,Arial,sans-serif; line-height:1.45;
    padding:var(--pad) var(--pad) calc(28px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1040px; margin:0 auto;}

  /* ---------- Kopf ---------- */
  .top{display:flex; align-items:flex-end; justify-content:space-between;
    gap:16px; flex-wrap:wrap; margin-bottom:clamp(14px,2.5vw,22px);}
  .place{font-size:12px; letter-spacing:.08em; text-transform:uppercase; opacity:.5;}
  h1{margin:2px 0 0; font-size:clamp(24px,5vw,34px); font-weight:700;}
  .date{font-size:14px; opacity:.6;}
  .clock{font-family:Consolas,monospace; font-size:clamp(26px,6vw,38px);
    font-weight:700; letter-spacing:.02em; line-height:1;}

  .card{background:var(--card); border-radius:16px; padding:clamp(14px,2.4vw,20px);
    box-shadow:0 8px 24px rgba(0,0,0,.35);}
  h2{margin:0 0 12px; font-size:13px; letter-spacing:.08em;
    text-transform:uppercase; opacity:.5; font-weight:700;}

  /* ---------- Wetter: eine Zeile ----------
     Das Wetter ist Beiwerk, die Apps sind der Zweck der Seite. Deshalb steht
     hier nur das Nötige; Stunden, Woche und Nebenwerte klappt auf, wer sie
     sehen will - die Einstellung merkt sich der Browser. */
  .wx{padding:12px clamp(12px,2vw,16px);}
  .wxbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .wxbar .ico{width:44px; height:44px; flex:0 0 auto;}
  .temp{font-size:30px; font-weight:700; line-height:1;
    font-variant-numeric:tabular-nums;}
  .wxtxt{min-width:120px;}
  .cond{font-size:14px;}
  .feels{font-size:12px; opacity:.5;}
  .kurz{flex:1; display:flex; gap:16px; flex-wrap:wrap; justify-content:flex-end;
    font-size:13px; opacity:.65; font-variant-numeric:tabular-nums;}
  .kurz b{font-weight:700; opacity:1;}
  .klapp{background:none; border:1px solid var(--line); color:var(--text);
    opacity:.6; border-radius:7px; padding:5px 10px; font-size:12px; cursor:pointer;
    flex:0 0 auto;}
  .klapp:hover{opacity:1;}
  .mehr{margin-top:12px; border-top:1px solid var(--line); padding-top:12px;}
  .mehr[hidden]{display:none;}
  .facts{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  @media (max-width:420px){ .facts{grid-template-columns:repeat(2,1fr);} }
  .fact{background:var(--card2); border-radius:10px; padding:8px 10px;}
  .fact .k{font-size:11px; letter-spacing:.05em; text-transform:uppercase; opacity:.45;}
  .fact .v{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums;
    white-space:nowrap;}
  .fact .v small{font-size:12px; font-weight:400; opacity:.6;}

  /* Stundenstreifen: rollt seitwärts, rastet an den Stunden ein */
  .hours{display:flex; gap:6px; overflow-x:auto; scroll-snap-type:x proximity;
    margin-top:12px; padding-bottom:4px;}
  .hour{flex:0 0 auto; width:60px; text-align:center; scroll-snap-align:start;
    background:var(--card2); border-radius:10px; padding:7px 4px;}
  .hour.now{box-shadow:inset 0 0 0 1px var(--accent);}
  .hour .h{font-size:11px; opacity:.55; font-variant-numeric:tabular-nums;}
  .hour svg{width:24px; height:24px; margin:3px auto 1px; display:block;}
  .hour .t{font-size:14px; font-weight:700; font-variant-numeric:tabular-nums;}
  .hour .p{font-size:11px; color:var(--cold); min-height:15px;
    font-variant-numeric:tabular-nums;}

  /* Wochenliste mit Temperaturbalken */
  .days{margin-top:12px; border-top:1px solid var(--line);}
  .dayrow{display:grid; gap:9px; align-items:center; padding:6px 2px;
    grid-template-columns:44px 24px 40px 1fr 32px 32px;
    border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums;}
  .dayrow:last-child{border-bottom:0;}
  .dayrow svg{width:22px; height:22px; display:block;}
  .dn{font-size:13px; font-weight:600;}
  .dn.we{color:var(--warn);}
  .rain{font-size:12px; color:var(--cold); text-align:right;}
  .lo{font-size:13px; opacity:.5; text-align:right;}
  .hi{font-size:13px; font-weight:700; text-align:right;}
  .range{position:relative; height:6px; border-radius:3px; background:var(--card2);}
  .range .bar{position:absolute; top:0; bottom:0; border-radius:3px;
    background:linear-gradient(90deg,var(--cold),var(--warn),var(--hot));}
  @media (max-width:420px){
    .dayrow{grid-template-columns:40px 22px 36px 1fr 30px 30px; gap:6px;}
    .kurz{justify-content:flex-start; gap:12px;}
  }

  /* ---------- Abfuhr ---------- */
  .ab{margin-top:clamp(10px,1.6vw,14px); padding:10px clamp(12px,2vw,16px);}
  .abbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .ablbl{font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    opacity:.45; flex:0 0 auto;}
  .abzeile{display:flex; gap:18px; flex-wrap:wrap; font-size:13px; opacity:.75;}
  .abzeile b{font-weight:700; opacity:1;}
  .abzeile .bald b{color:var(--warn);}

  /* ---------- Apps ---------- */
  .apps{margin-top:clamp(12px,2vw,18px); padding:clamp(16px,2.6vw,24px);}
  .appgrid{display:grid; gap:14px;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));}
  .app{display:flex; gap:16px; align-items:center; text-decoration:none;
    color:inherit; background:var(--card2); border-radius:14px;
    padding:20px 18px; min-height:104px;
    border:1px solid transparent; transition:border-color .15s, transform .15s;}
  .app:hover{border-color:var(--accent); transform:translateY(-2px);}
  .app:active{transform:translateY(0);}
  .app .badge{width:56px; height:56px; border-radius:13px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; background:#343a45;}
  .app .badge svg{width:34px; height:34px;}
  .app .nm{font-size:18px; font-weight:700;}
  .app .ds{font-size:13px; opacity:.6; line-height:1.4; margin-top:2px;}
  .app.soon{border:1px dashed var(--line); background:none; opacity:.45;
    cursor:default;}
  .app.soon:hover{transform:none; border-color:var(--line);}
  .app.soon .badge{background:none; box-shadow:inset 0 0 0 1px var(--line);
    font-size:22px; opacity:.7;}
  .app.add{border:1px solid var(--line); background:none; cursor:pointer;
    text-align:left; font:inherit; color:inherit; width:100%;}
  .app.add .badge{background:none; box-shadow:inset 0 0 0 1px var(--accent);
    color:var(--accent); font-size:26px;}

  /* ---------- Verbindung ---------- */
  .net{margin-top:clamp(12px,2vw,18px); padding:12px clamp(12px,2vw,16px);}
  .netbar{display:flex; align-items:center; gap:12px;}
  .nsum{flex:1; font-size:13px; opacity:.7; font-variant-numeric:tabular-nums;}
  .nsum b{font-weight:700; opacity:1;}
  .nsub{font-size:12px; opacity:.5; margin-top:8px; font-variant-numeric:tabular-nums;}
  /* Balken zeigt, worin die Ladezeit steckt: Auflösung, Verbindung, Warten … */
  .bars{display:flex; height:8px; border-radius:4px; overflow:hidden;
    background:#141821;}
  .bars i{display:block; height:100%;}
  .bars i:nth-child(1){background:#5b9ad5;} .bars i:nth-child(2){background:#7fd88f;}
  .bars i:nth-child(3){background:#c9a86a;} .bars i:nth-child(4){background:#f0c14b;}
  .bars i:nth-child(5){background:#e07a5f;}
  .speed{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:12px;}
  .sbtn{background:var(--accent); color:#0e1a09; border:0; border-radius:9px;
    padding:11px 16px; font-size:14px; font-weight:700; cursor:pointer;}
  .sbtn:disabled{opacity:.5; cursor:progress;}
  .sres{font-size:14px; opacity:.75; font-variant-numeric:tabular-nums;}
  .sres b{font-size:17px; opacity:1;}
  .hist{margin-top:10px; font-size:12px; opacity:.5; line-height:1.7;
    font-variant-numeric:tabular-nums;}
  .hist div{display:flex; gap:14px;}
  .hist .w{min-width:104px;}
  .note{margin-top:10px; font-size:11px; opacity:.4; line-height:1.4;}

  /* ---------- Fuß ---------- */
  .foot{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin-top:clamp(14px,2.5vw,22px); font-size:12px; opacity:.5;}
  .foot a{color:inherit;}
  .rfr{background:none; border:0; color:var(--text); opacity:.7; cursor:pointer;
    font-size:15px; line-height:1; padding:3px 6px; border-radius:6px;}
  .rfr:hover{opacity:1; background:var(--line);}
  .rfr.busy{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .msg{background:#2f2a1c; color:var(--warn); border-radius:10px;
    padding:10px 12px; font-size:13px; margin-bottom:12px;}
  .skel{opacity:.35;}
  /* Ohne Daten keine leeren Streifen und keine Trennlinie ins Nichts */
  .hours:empty{display:none;}
  .days:empty{display:none;}


</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <div class="place" id="place">Seekirchen am Wallersee</div>
      <h1 id="greet">Hallo</h1>
      <div class="date" id="today">&nbsp;</div>
    </div>
    <div class="clock" id="clock">--:--</div>
  </div>

  <!-- Wetter: eine Zeile. Alles Weitere erst auf Wunsch. -->
  <section class="card wx">
    <div id="wxMsg"></div>
    <div class="wxbar">
      <div class="ico" id="wxIcon"></div>
      <div class="temp skel" id="wxTemp">--°</div>
      <div class="wxtxt">
        <div class="cond" id="wxCond">wird geladen …</div>
        <div class="feels" id="wxFeels">&nbsp;</div>
      </div>
      <div class="kurz" id="wxKurz"></div>
      <button class="klapp" id="wxKlapp" aria-expanded="false">mehr</button>
    </div>
    <div class="mehr" id="wxMehr" hidden>
      <div class="facts" id="wxFacts"></div>
      <div class="hours" id="wxHours"></div>
      <div class="days" id="wxDays"></div>
    </div>
  </section>

  <!-- Abfuhr: nur da, wenn es Termine gibt -->
  <section class="card ab" id="abBox" hidden>
    <div class="abbar">
      <span class="ablbl">Abfuhr</span>
      <div class="abzeile" id="abZeile"></div>
    </div>
  </section>

  <!-- Apps: der Hauptinhalt der Seite -->
  <section class="card apps">
    <h2>Apps</h2>
    <div class="appgrid" id="apps"></div>
  </section>

  <section class="card net">
    <div class="netbar">
      <div class="nsum" id="nvSum">Verbindung wird gemessen …</div>
      <button class="klapp" id="npKlapp" aria-expanded="false">mehr</button>
    </div>
    <div class="mehr" id="npMehr" hidden>
      <div class="bars" id="nvBars"></div>
      <div class="nsub" id="nvPingS">&nbsp;</div>
      <div class="speed">
        <button class="sbtn" id="spBtn">Geschwindigkeit messen</button>
        <div class="sres" id="spRes">Lädt rund 16 MB herunter und 12 MB hinauf.</div>
      </div>
      <div class="hist" id="spHist"></div>
      <div class="note">Gemessen wird der Weg zu diesem Server – eine Untergrenze,
        kein Ersatz für einen Anbieter-Test.</div>
    </div>
  </section>

  <div class="foot">
    <span id="wxAge">&nbsp;</span>
    <button class="rfr" id="wxRfr" title="Neu laden">↻</button>
    <span style="flex:1"></span>
    <span>Wetterdaten von <a href="https://open-meteo.com/" target="_blank"
      rel="noopener">Open-Meteo</a></span>
  </div>
</div>

<script>
/* ---------------------------------------------------------------
   Startseite: Wetter für Seekirchen am Wallersee und die Auswahl
   der Anwendungen. Eine einzelne Datei ohne Abhängigkeiten - sie
   liegt als index.html im Web-Verzeichnis und braucht kein PHP.
   --------------------------------------------------------------- */

/* Ort. Über die Adresszeile umstellbar: ?lat=..&lon=..&ort=.. */
const Q=new URLSearchParams(location.search);
const ORT={
  name: Q.get('ort') || 'Seekirchen am Wallersee',
  lat:  +(Q.get('lat') || 47.8894),
  lon:  +(Q.get('lon') || 13.1372)
};

/* Die Auswahl der Anwendungen. Neue Kachel = eine Zeile mehr. */
const APPS=[
  { name:'Schach', datei:'chess.html', icon:'chess',
    text:'Zwei Spieler an zwei Rechnern, Zuschauer, Uhr und Auswertung.' }
];

/* ---------- Wettersymbole (WMO-Schlüssel) ---------- */
const SVG=(inhalt)=>'<svg viewBox="0 0 64 64" fill="none" stroke-linecap="round" '+
  'stroke-linejoin="round">'+inhalt+'</svg>';
const SONNE=(cx,cy,r)=>{
  let s='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#f6c452"/>';
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4, r1=r+3.5, r2=r+8;
    s+='<line x1="'+(cx+Math.cos(a)*r1).toFixed(1)+'" y1="'+(cy+Math.sin(a)*r1).toFixed(1)+
       '" x2="'+(cx+Math.cos(a)*r2).toFixed(1)+'" y2="'+(cy+Math.sin(a)*r2).toFixed(1)+
       '" stroke="#f6c452" stroke-width="3"/>';
  }
  return s;
};
const MOND='<path d="M40 14a17 17 0 1 0 12 26 19 19 0 0 1-12-26z" fill="#dfe6f0"/>';
const WOLKE=(y,f)=>'<path d="M20 '+(y+8)+'a10 10 0 0 1 1-19 14 14 0 0 1 26-3 '+
  '9 9 0 0 1 1 22z" fill="'+(f||'#c8d2e0')+'"/>';
const TROPF=(x,y,c)=>'<line x1="'+x+'" y1="'+y+'" x2="'+(x-3)+'" y2="'+(y+9)+
  '" stroke="'+(c||'#6ea8e8')+'" stroke-width="3.4"/>';
const FLOCKE=(x,y)=>'<g stroke="#bfe0ff" stroke-width="2.6">'+
  '<line x1="'+(x-4)+'" y1="'+y+'" x2="'+(x+4)+'" y2="'+y+'"/>'+
  '<line x1="'+x+'" y1="'+(y-4)+'" x2="'+x+'" y2="'+(y+4)+'"/>'+
  '<line x1="'+(x-3)+'" y1="'+(y-3)+'" x2="'+(x+3)+'" y2="'+(y+3)+'"/>'+
  '<line x1="'+(x-3)+'" y1="'+(y+3)+'" x2="'+(x+3)+'" y2="'+(y-3)+'"/></g>';
const BLITZ='<path d="M34 40l-8 12h7l-3 10 11-14h-7l4-8z" fill="#f6c452"/>';

/* Beschreibung und Bild je Schlüssel; nachts eigene Fassung */
function wetter(code,tag){
  const c=+code, hell=(tag===undefined)?true:!!tag;
  const klar=hell?SONNE(32,30,11):MOND;
  if(c===0)  return {t:hell?'Klar':'Klare Nacht',      s:SVG(klar)};
  if(c===1)  return {t:'Überwiegend klar',             s:SVG(klar)};
  if(c===2)  return {t:'Teils bewölkt',
                     s:SVG((hell?SONNE(24,24,9):'<path d="M30 12a13 13 0 1 0 9 20 '+
                       '15 15 0 0 1-9-20z" fill="#dfe6f0"/>')+WOLKE(24))};
  if(c===3)  return {t:'Bedeckt',                      s:SVG(WOLKE(22,'#aab4c2'))};
  if(c===45||c===48) return {t:c===48?'Reifnebel':'Nebel',
    s:SVG(WOLKE(16,'#b7bec9')+
      '<g stroke="#b7bec9" stroke-width="3">'+
      '<line x1="16" y1="44" x2="46" y2="44"/><line x1="20" y1="51" x2="42" y2="51"/></g>')};
  if(c>=51&&c<=57) return {t:c>=56?'Gefrierender Sprühregen':'Sprühregen',
    s:SVG(WOLKE(16)+TROPF(26,40)+TROPF(36,40))};
  if(c>=61&&c<=67){
    const t=c===61?'Leichter Regen':c===63?'Regen':c===65?'Starker Regen':
            'Gefrierender Regen';
    return {t:t, s:SVG(WOLKE(16)+TROPF(24,40)+TROPF(32,43)+TROPF(40,40))};
  }
  if(c>=71&&c<=77) return {t:c===75?'Starker Schneefall':'Schneefall',
    s:SVG(WOLKE(16)+FLOCKE(25,45)+FLOCKE(39,45))};
  if(c>=80&&c<=82) return {t:c===82?'Heftige Schauer':'Regenschauer',
    s:SVG((hell?SONNE(24,22,8):MOND)+WOLKE(18)+TROPF(28,44)+TROPF(38,44))};
  if(c===85||c===86) return {t:'Schneeschauer',
    s:SVG(WOLKE(16)+FLOCKE(25,45)+FLOCKE(39,45))};
  if(c>=95) return {t:c===95?'Gewitter':'Gewitter mit Hagel',
    s:SVG(WOLKE(14,'#9aa5b4')+BLITZ)};
  return {t:'Wetter', s:SVG(WOLKE(22))};
}

/* ---------- Kleinkram ---------- */
const el=(id)=>document.getElementById(id);
const num=(v,n)=>(v===null||v===undefined||isNaN(v))?'–'
  :String((+v).toFixed(n||0)).replace('.',',');
const WOCHE=['So','Mo','Di','Mi','Do','Fr','Sa'];
const HIMMEL=['N','NO','O','SO','S','SW','W','NW'];
function richtung(grad){
  if(grad===null||grad===undefined) return '';
  return HIMMEL[Math.round(((grad%360)/45))%8];
}
function uhr(iso){ return (iso||'').slice(11,16); }
function heuteText(d){
  return d.toLocaleDateString('de-AT',
    {weekday:'long', day:'numeric', month:'long'});
}
function grussText(h){
  return h<5?'Gute Nacht':h<11?'Guten Morgen':h<14?'Mahlzeit'
        :h<18?'Guten Tag':h<22?'Guten Abend':'Gute Nacht';
}

/* ---------- Anwendungen ---------- */
const APPICON={
  chess:'<svg viewBox="0 0 24 24" fill="none" stroke="#e8d3a8" stroke-width="1.7" '+
    'stroke-linecap="round" stroke-linejoin="round">'+
    '<path d="M9 3h6M12 3v3M8.5 6h7l-1.2 3.2a4 4 0 0 1-1.1 1.6l-.7.6 1 4.6H9.5l1-4.6'+
    '-.7-.6a4 4 0 0 1-1.1-1.6L8.5 6z"/><path d="M7 19h10l1 2H6l1-2z"/></svg>'
};
function zeigeApps(){
  const box=el('apps');
  box.innerHTML=APPS.map(a=>
    '<a class="app" href="'+a.datei+'">'+
      '<span class="badge">'+(APPICON[a.icon]||'')+'</span>'+
      '<span><span class="nm">'+a.name+'</span>'+
      '<div class="ds">'+a.text+'</div></span></a>').join('')+
    '<div class="app soon"><span class="badge">＋</span>'+
    '<span><span class="nm">Weitere folgen</span>'+
    '<div class="ds">Platz für die nächste Anwendung.</div></span></div>';
}

/* ---------- Wetter holen und anzeigen ----------
   Open-Meteo braucht keinen Schlüssel und erlaubt den Zugriff direkt
   aus dem Browser. Die letzte gelungene Antwort wird im Browser
   abgelegt: Ist der Dienst gerade nicht erreichbar, steht wenigstens
   der letzte Stand da - mit Angabe, wie alt er ist. */
/* Zugriff mit Zeitgrenze - ohne sie kann ein Abruf ewig offen bleiben */
function fetchT(url,opt,ms){
  const ac=new AbortController();
  const t=setTimeout(()=>ac.abort(),ms||8000);
  return fetch(url,Object.assign({signal:ac.signal},opt||{}))
    .finally(()=>clearTimeout(t));
}

const API='https://api.open-meteo.com/v1/forecast';
const FELDER=
  '&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,'+
  'precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m'+
  '&hourly=temperature_2m,precipitation_probability,weather_code,is_day'+
  '&daily=weather_code,temperature_2m_max,temperature_2m_min,'+
  'precipitation_probability_max,sunrise,sunset'+
  '&timezone=Europe%2FVienna&forecast_days=7';
let daten=null, geholt=0, laeuft=false;

function url(){
  return API+'?latitude='+ORT.lat.toFixed(4)+'&longitude='+ORT.lon.toFixed(4)+FELDER;
}
async function holen(){
  if(laeuft) return;
  laeuft=true;
  const knopf=el('wxRfr'); knopf.classList.add('busy');
  try{
    const ac=new AbortController();
    const t=setTimeout(()=>ac.abort(),12000);
    const r=await fetch(url(),{cache:'no-store',signal:ac.signal})
      .finally(()=>clearTimeout(t));
    if(!r.ok){
      // Open-Meteo begruendet Fehler im Text - das ist hilfreicher als die Nummer
      let grund=''; try{ grund=(await r.json()).reason||''; }catch(e2){}
      throw new Error(grund||('HTTP '+r.status));
    }
    const j=await r.json();
    if(j&&j.error) throw new Error(j.reason||'Fehler vom Wetterdienst');
    if(!j||!j.current||!j.daily) throw new Error('Antwort unvollständig');
    daten=j; geholt=Date.now();
    try{ localStorage.setItem('wx',JSON.stringify({t:geholt,d:j})); }catch(e){}
    zeigeWetter('');
  }catch(e){
    // Nichts wegwerfen: der alte Stand bleibt stehen, der Hinweis erklärt warum
    zeigeWetter(daten ? 'Wetterdienst nicht erreichbar – angezeigt wird der letzte Stand.'
                      : 'Wetter kann gerade nicht geladen werden ('+e.message+').');
    if(!daten) el('wxCond').textContent='keine Daten';
  }finally{
    laeuft=false;
    setTimeout(()=>knopf.classList.remove('busy'),600);
  }
}
function ausSpeicher(){
  try{
    const v=JSON.parse(localStorage.getItem('wx')||'null');
    if(v&&v.d&&v.d.current){ daten=v.d; geholt=v.t||0; zeigeWetter(''); }
  }catch(e){}
}

function zeigeWetter(hinweis){
  el('wxMsg').innerHTML = hinweis ? '<div class="msg">'+hinweis+'</div>' : '';
  if(!daten) return;
  const c=daten.current, d=daten.daily, h=daten.hourly;
  const w=wetter(c.weather_code, c.is_day);
  el('wxIcon').innerHTML=w.s;
  const temp=el('wxTemp');
  temp.textContent=num(c.temperature_2m)+'°';
  temp.classList.remove('skel');
  el('wxCond').textContent=w.t;
  el('wxFeels').textContent='gefühlt '+num(c.apparent_temperature)+'°  ·  heute '+
    num(d.temperature_2m_min[0])+'° bis '+num(d.temperature_2m_max[0])+'°';

  /* Die Zeile trägt nur, was man im Vorbeigehen liest: Regen heute, Wind,
     und wann die Sonne untergeht. Der Rest steckt im aufgeklappten Teil. */
  const rp=d.precipitation_probability_max?d.precipitation_probability_max[0]:null;
  el('wxKurz').innerHTML=[
    ['Regen', (rp===null||rp===undefined)?'–':rp+' %'],
    ['Wind', num(c.wind_speed_10m)+' km/h'],
    ['Sonne bis', uhr(d.sunset&&d.sunset[0])]
  ].map(f=>'<span>'+f[0]+' <b>'+f[1]+'</b></span>').join('');

  const wind=num(c.wind_speed_10m)+' km/h', boe=c.wind_gusts_10m;
  el('wxFacts').innerHTML=[
    ['Wind', wind+(richtung(c.wind_direction_10m)?' <small>'+
        richtung(c.wind_direction_10m)+'</small>':'')],
    ['Böen', boe===undefined?'–':num(boe)+' km/h'],
    ['Feuchte', num(c.relative_humidity_2m)+' %'],
    ['Niederschlag', num(c.precipitation,1)+' mm'],
    ['Sonnenauf', uhr(d.sunrise&&d.sunrise[0])],
    ['Sonnenunter', uhr(d.sunset&&d.sunset[0])]
  ].map(f=>'<div class="fact"><div class="k">'+f[0]+'</div>'+
           '<div class="v">'+f[1]+'</div></div>').join('');

  /* Stundenstreifen ab der laufenden Stunde */
  if(h&&h.time){
    const jetzt=(c.time||'').slice(0,13);
    let i=h.time.findIndex(t=>t.slice(0,13)===jetzt);
    if(i<0) i=0;
    let s='';
    for(let k=i;k<Math.min(i+24,h.time.length);k++){
      const hw=wetter(h.weather_code[k], h.is_day?h.is_day[k]:1);
      const p=h.precipitation_probability?h.precipitation_probability[k]:null;
      s+='<div class="hour'+(k===i?' now':'')+'">'+
         '<div class="h">'+(k===i?'jetzt':uhr(h.time[k]))+'</div>'+hw.s+
         '<div class="t">'+num(h.temperature_2m[k])+'°</div>'+
         '<div class="p">'+(p>=20?p+' %':'')+'</div></div>';
    }
    el('wxHours').innerHTML=s;
  }

  /* Woche: Balken zeigt die Spanne des Tages innerhalb der Wochenspanne */
  const lo=Math.min.apply(null,d.temperature_2m_min);
  const hi=Math.max.apply(null,d.temperature_2m_max);
  const span=Math.max(1,hi-lo);
  let r='';
  for(let i=0;i<d.time.length;i++){
    const tag=new Date(d.time[i]+'T12:00:00');
    const we=(tag.getDay()===0||tag.getDay()===6);
    const a=(d.temperature_2m_min[i]-lo)/span*100;
    const b=(d.temperature_2m_max[i]-lo)/span*100;
    const p=d.precipitation_probability_max?d.precipitation_probability_max[i]:null;
    r+='<div class="dayrow">'+
       '<div class="dn'+(we?' we':'')+'">'+(i===0?'heute':WOCHE[tag.getDay()]+'.')+'</div>'+
       wetter(d.weather_code[i],1).s+
       '<div class="rain">'+(p>=20?p+' %':'')+'</div>'+
       '<div class="range"><div class="bar" style="left:'+a.toFixed(1)+
         '%; width:'+Math.max(3,b-a).toFixed(1)+'%"></div></div>'+
       '<div class="lo">'+num(d.temperature_2m_min[i])+'°</div>'+
       '<div class="hi">'+num(d.temperature_2m_max[i])+'°</div>'+
       '</div>';
  }
  el('wxDays').innerHTML=r;
  alter();
}
function alter(){
  if(!geholt){ el('wxAge').textContent=''; return; }
  const s=Math.round((Date.now()-geholt)/1000);
  el('wxAge').textContent='Stand: '+(s<90?'gerade eben'
    : s<5400?('vor '+Math.round(s/60)+' min')
    : ('vor '+Math.round(s/3600)+' h'));
}

/* ---------- Verbindung ----------
   Drei Dinge, streng getrennt:
     1. Was der Aufruf DIESER Seite gekostet hat - der Browser hat es ohnehin
        mitgeschrieben, das kostet kein einziges Byte extra.
     2. Antwortzeit des Servers - ein paar Kopfabfragen, Median daraus.
     3. Durchsatz - nur auf Knopfdruck, weil es am Datenvolumen zehrt.
   Gemessen wird immer nur der Weg zu diesem Server. */
const MB=1048576;
const ZIEL_DL=16*MB, ZIEL_UL=12*MB, FRIST=12000;   // Menge und Zeitbudget
const PARALLEL=4;                                  // eine Verbindung allein
                                                   // schöpft schnelle Leitungen nicht aus
function mbit(bytes,ms){ return ms>0 ? (bytes*8/1000/ms) : 0; }
const komma=(s)=>String(s).replace('.',',');
function zahl(v){ return komma(v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2)); }
function kbyte(b){ return komma(b>=MB?(b/MB).toFixed(1)+' MB'
                                     :(b/1024).toFixed(1)+' KB'); }

/* ---------- Abfuhrtermine ----------
   Kommt von api/muell.php (liest den Abfuhrkalender der Gemeinde). Fehlt der
   Endpunkt oder ist er nicht eingerichtet, bleibt die Zeile einfach weg -
   eine leere Karte hilft niemandem. */
function tagText(iso){
  const d=new Date(iso+'T12:00:00'), h=new Date(); h.setHours(12,0,0,0);
  const tage=Math.round((d-h)/86400000);
  if(tage<=0) return 'heute';
  if(tage===1) return 'morgen';
  if(tage===2) return 'übermorgen';
  return WOCHE[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.';
}
async function muell(){
  let j=null;
  try{
    const r=await fetchT('api/muell.php',{cache:'no-store'},8000);
    if(!r.ok) return;                       // nicht hochgeladen: still bleiben
    j=await r.json();
  }catch(e){ return; }
  if(!j||!j.termine||!j.termine.length) return;
  el('abZeile').innerHTML=j.termine.slice(0,4).map(t=>{
    const d=new Date(t.d+'T12:00:00'), h=new Date(); h.setHours(12,0,0,0);
    const bald=(d-h)<=86400000*2;
    return '<span'+(bald?' class="bald"':'')+'>'+esc(t.t)+' <b>'+
           tagText(t.d)+'</b></span>';
  }).join('');
  el('abBox').hidden=false;
}
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Kopfzeile der Verbindungskarte: knapp, beide Werte in einer Zeile */
const Nv={ladung:null, ping:null, groesse:0, teile:'', pingS:''};
function zeigeNet(){
  const t=[];
  t.push('Aufruf '+(Nv.ladung===null?'…':'<b>'+Math.round(Nv.ladung)+' ms</b>'));
  t.push('Antwort '+(Nv.ping===null?'…':'<b>'+Math.round(Nv.ping)+' ms</b>'));
  if(Nv.groesse) t.push(kbyte(Nv.groesse));
  el('nvSum').innerHTML=t.join(' · ');
  el('nvPingS').textContent=[Nv.teile,Nv.pingS].filter(Boolean).join('  ·  ');
}

/* 1. Aufschlüsselung des eigenen Seitenaufrufs */
function ladung(){
  const n=(performance.getEntriesByType&&
           performance.getEntriesByType('navigation')[0])||null;
  if(!n||!n.responseEnd){ Nv.teile='vom Browser nicht gemeldet'; zeigeNet(); return; }
  const dns=n.domainLookupEnd-n.domainLookupStart;
  const tcp=(n.secureConnectionStart>0?n.secureConnectionStart:n.connectEnd)-n.connectStart;
  const tls=n.secureConnectionStart>0?(n.connectEnd-n.secureConnectionStart):0;
  const wait=n.responseStart-n.requestStart;              // Wartezeit auf das erste Byte
  const load=n.responseEnd-n.responseStart;
  const ms=v=>Math.max(0,Math.round(v))+' ms';
  const teile=[['DNS',dns],['Verbindung',tcp],['TLS',tls],['Antwort',wait],
               ['Übertragung',load]];
  Nv.ladung=n.responseEnd; Nv.groesse=n.transferSize||0;
  Nv.teile=teile.filter(t=>t[1]>0.5).map(t=>t[0]+' '+ms(t[1])).join(' · ');
  zeigeNet();
  const ganz=Math.max(1,dns+tcp+tls+wait+load);
  el('nvBars').innerHTML=teile.map(t=>
    '<i style="width:'+(t[1]/ganz*100).toFixed(1)+'%" title="'+t[0]+' '+ms(t[1])+
    '"></i>').join('');
}

/* 2. Antwortzeit: Kopfabfrage auf die eigene Seite, Median aus mehreren */
async function antwortzeit(n){
  const werte=[];
  for(let i=0;i<(n||7);i++){
    const t0=performance.now();
    try{
      await fetch(location.pathname+'?ping='+Date.now()+'.'+i,
        {method:'HEAD',cache:'no-store'});
      werte.push(performance.now()-t0);
    }catch(e){}
    await new Promise(r=>setTimeout(r,120));
  }
  if(!werte.length){ Nv.pingS='keine Antwort'; zeigeNet(); return; }
  werte.sort((a,b)=>a-b);
  Nv.ping=werte[werte.length>>1];
  const spanne=(werte[werte.length-1]-werte[0])/2;
  Nv.pingS='Median aus '+werte.length+' · ±'+Math.round(spanne)+' ms';
  zeigeNet();
}

/* 3a. Download. Als Last dient die Engine-Datei, die ohnehin auf dem Server
   liegt - erspart eine eigene Testdatei. Der Bereichskopf hält die Anfrage
   klein, wo der Server ihn beachtet; wo nicht, wird einfach abgebrochen,
   sobald genug Bytes da sind. */
async function download(melde){
  const kandidaten=['stockfish-18-lite-single.wasm','chess.html',location.pathname];
  let quelle=null, groesse=0;
  for(const k of kandidaten){
    try{
      const r=await fetch(k+'?p='+Date.now(),{method:'HEAD',cache:'no-store'});
      if(!r.ok) continue;
      const len=+(r.headers.get('content-length')||0);
      if(len>groesse){ groesse=len; quelle=k; }
      if(len>2*MB) break;                       // groß genug, nicht weitersuchen
    }catch(e){}
  }
  if(!quelle) throw new Error('keine Datei zum Messen gefunden');

  const ac=new AbortController();
  const je=Math.max(MB,Math.ceil(ZIEL_DL/PARALLEL));
  let bytes=0, erstes=0, fertig=0, gemeldet=0;
  const stopp=setTimeout(()=>ac.abort(),FRIST);
  const strom=async(i)=>{
    const r=await fetch(quelle+'?p='+Date.now()+'.'+i,
      {cache:'no-store',signal:ac.signal,headers:{'Range':'bytes=0-'+(je-1)}});
    if(!r.ok&&r.status!==206) throw new Error('HTTP '+r.status);
    const leser=r.body.getReader();
    let eigen=0;
    while(true){
      const {done,value}=await leser.read();
      if(done) break;
      // Erst ab dem ersten Byte messen: davor liegen Aufbau und Wartezeit
      if(!erstes) erstes=performance.now();
      bytes+=value.length; eigen+=value.length; fertig=performance.now();
      // Anzeige höchstens alle 150 ms auffrischen, sonst bremst sie die Messung
      if(melde&&fertig-gemeldet>150){ gemeldet=fertig; melde(bytes,fertig-erstes); }
      if(eigen>=je||bytes>=ZIEL_DL){ try{ leser.cancel(); }catch(e){} break; }
    }
  };
  const pannen=[], laeufe=[];
  for(let i=0;i<PARALLEL;i++) laeufe.push(strom(i).catch(e=>pannen.push(e)));
  await Promise.all(laeufe);                    // Abbruch nach Frist ist in Ordnung
  clearTimeout(stopp); try{ ac.abort(); }catch(e){}
  if(!bytes) throw pannen[0]||new Error('keine Daten empfangen');
  const dauer=Math.max(1,fertig-erstes);
  return {bytes:bytes, ms:dauer, rate:mbit(bytes,dauer), quelle:quelle};
}

/* 3b. Upload gegen api/speed.php - der Endpunkt zählt nur und wirft weg.
   XMLHttpRequest statt fetch, weil nur er den Sendefortschritt meldet. */
function senden(blob,ms){
  return new Promise((ok,fehler)=>{
    const x=new XMLHttpRequest();
    x.open('POST','api/speed.php?p='+Date.now()+'.'+Math.random());
    x.timeout=FRIST;
    x.upload.onprogress=(e)=>{ if(ms) ms(e.loaded); };
    x.onload=()=>x.status>=200&&x.status<300?ok(blob.size):fehler(new Error('HTTP '+x.status));
    x.onerror=()=>fehler(new Error('Verbindung abgebrochen'));
    x.ontimeout=()=>fehler(new Error('Zeitüberschreitung'));
    x.send(blob);
  });
}
async function upload(melde){
  let grenze=4*MB;
  try{
    const r=await fetch('api/speed.php?p='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j&&j.max) grenze=Math.min(grenze,Math.floor(j.max*0.9));
  }catch(e){ throw new Error('api/speed.php fehlt'); }

  // Zufallsdaten, damit unterwegs nichts komprimiert werden kann
  const roh=new Uint8Array(MB);
  for(let i=0;i<roh.length;i+=4096){
    const s=crypto.getRandomValues(new Uint8Array(Math.min(4096,roh.length-i)));
    roh.set(s,i);
  }
  let stueck=Math.min(MB,grenze), gesamt=0, zeit=0;
  const t0=performance.now();
  while(gesamt<ZIEL_UL && performance.now()-t0<FRIST){
    // Drei Ströme je Runde; die letzte Runde nur noch so groß wie nötig
    const proStrom=Math.min(stueck,
                            Math.max(65536,Math.ceil((ZIEL_UL-gesamt)/3)));
    const teile=[];
    for(let rest=proStrom; rest>0; rest-=MB)
      teile.push(rest>=MB ? roh : roh.subarray(0,rest));
    const blob=new Blob(teile);
    const r0=performance.now();
    const runde=[];
    for(let i=0;i<3;i++) runde.push(senden(blob,()=>{}));
    await Promise.all(runde);
    const dt=performance.now()-r0;
    gesamt+=blob.size*3; zeit+=dt;
    if(melde) melde(gesamt,zeit);
    if(dt<1500 && stueck*2<=grenze) stueck*=2;   // schnelle Leitung: mehr auf einmal
  }
  return {bytes:gesamt, ms:Math.max(1,zeit), rate:mbit(gesamt,Math.max(1,zeit))};
}

/* Ablauf und Verlauf */
function verlauf(eintrag){
  let v=[];
  try{ v=JSON.parse(localStorage.getItem('speed')||'[]'); }catch(e){}
  if(eintrag){ v.unshift(eintrag); v=v.slice(0,5);
               try{ localStorage.setItem('speed',JSON.stringify(v)); }catch(e){} }
  el('spHist').innerHTML=v.map(e=>{
    const d=new Date(e.t);
    return '<div><span class="w">'+d.toLocaleDateString('de-AT',
        {day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('de-AT',
        {hour:'2-digit',minute:'2-digit'})+'</span>'+
      '<span>↓ '+zahl(e.dl)+' Mbit/s</span>'+
      '<span>'+(e.ul?('↑ '+zahl(e.ul)+' Mbit/s'):'↑ –')+'</span></div>';
  }).join('');
}
let misst=false;
async function messen(){
  if(misst) return;
  misst=true;
  const knopf=el('spBtn'), aus=el('spRes');
  knopf.disabled=true;
  let dl=0, ul=0, dlB=0, ulB=0, hinweis='';
  try{
    aus.textContent='Download läuft …';
    const d=await download((b,ms)=>{
      aus.innerHTML='Download <b>'+zahl(mbit(b,ms))+' Mbit/s</b> · '+kbyte(b);
    });
    dl=d.rate; dlB=d.bytes;
    aus.innerHTML='Download <b>'+zahl(dl)+' Mbit/s</b> · Upload läuft …';
    try{
      const u=await upload((b,ms)=>{
        aus.innerHTML='Download <b>'+zahl(dl)+' Mbit/s</b> · Upload <b>'+
          zahl(mbit(b,ms))+' Mbit/s</b>';
      });
      ul=u.rate; ulB=u.bytes;
    }catch(e){ hinweis=' · Upload nicht gemessen ('+e.message+')'; }
    // Übertragene Menge dazusagen - sie geht auf das Datenvolumen
    aus.innerHTML='Download <b>'+zahl(dl)+' Mbit/s</b>'+
      (ul?(' · Upload <b>'+zahl(ul)+' Mbit/s</b>'):'')+hinweis+
      '<div style="font-size:12px;opacity:.55">übertragen: '+kbyte(dlB)+
      ' herunter'+(ulB?(', '+kbyte(ulB)+' hinauf'):'')+'</div>';
    verlauf({t:Date.now(), dl:dl, ul:ul});
  }catch(e){
    aus.textContent='Messung nicht möglich: '+e.message;
  }finally{
    misst=false; knopf.disabled=false;
  }
}

/* Auf- und Zuklappen. Was einmal offen war, bleibt beim nächsten Besuch offen. */
function klapper(knopf,teil,name){
  const b=el(knopf), t=el(teil);
  const setze=(auf)=>{
    t.hidden=!auf;
    b.textContent=auf?'weniger':'mehr';
    b.setAttribute('aria-expanded',auf?'true':'false');
    try{ localStorage.setItem('auf.'+name,auf?'1':'0'); }catch(e){}
  };
  let auf=false;
  try{ auf=localStorage.getItem('auf.'+name)==='1'; }catch(e){}
  setze(auf);
  b.addEventListener('click',()=>setze(t.hidden));
}
klapper('wxKlapp','wxMehr','wetter');
klapper('npKlapp','npMehr','netz');
muell();

/* ---------- Zum Startbildschirm hinzufügen ----------
   Android/Chrome meldet sich von selbst, sobald die Seite dafür taugt; dann
   erscheint eine Kachel, die den Dialog öffnet. Apple kennt das nicht, dort
   steht stattdessen der Weg über das Teilen-Menü. Läuft die Seite bereits
   als App, ist beides überflüssig. */
let installer=null;
const alsApp=()=>matchMedia('(display-mode: standalone)').matches ||
                 navigator.standalone===true;
function zeigeInstall(text,tat){
  if(document.getElementById('appAdd')) return;
  const k=document.createElement(tat?'button':'div');
  k.className='app add'; k.id='appAdd';
  k.innerHTML='<span class="badge">＋</span><span>'+
    '<span class="nm">Zum Startbildschirm</span>'+
    '<div class="ds">'+text+'</div></span>';
  if(tat) k.addEventListener('click',tat);
  el('apps').appendChild(k);
}
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault(); installer=e;
  zeigeInstall('Als App öffnen, ohne Adressleiste.',async()=>{
    installer.prompt();
    try{ await installer.userChoice; }catch(err){}
    installer=null;
    const k=document.getElementById('appAdd'); if(k) k.remove();
  });
});
if(!alsApp() && /iPhone|iPad|iPod/.test(navigator.userAgent))
  zeigeInstall('In Safari: Teilen ▸ „Zum Home-Bildschirm".',null);

/* Dienstprogramm: hält die Seite auch ohne Netz vorführbar. Es fragt immer
   zuerst den Server, damit keine alte Fassung hängen bleibt. */
if('serviceWorker' in navigator && location.protocol!=='file:')
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js')
    .catch(()=>{}));

   der Durchsatz nur auf Knopfdruck */

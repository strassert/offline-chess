<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schach</title>
<style>
  :root{
    --light:#e8d3a8; --dark:#9d6b3f; --bg:#20232a; --panel:#2b2f38;
    --text:#f2efe7; --accent:#6fae5f; --sel:#f6e05e; --move:#7fd8ff; --check:#ff6b6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg); color:var(--text); font-family:Segoe UI,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; height:100%;
    overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  .app{display:flex; gap:24px; align-items:stretch; justify-content:center;}
  .boardwrap{position:relative;}
  #board{
    display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr);
    width:720px; height:720px;
    border:6px solid #3c2f22; border-radius:6px; box-shadow:0 10px 30px rgba(0,0,0,.5);
    touch-action:manipulation;
  }
  .sq{position:relative; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .sq.light{background:var(--light);} .sq.dark{background:var(--dark);}
  .sq .piece{font-size:66px; line-height:1; pointer-events:none; paint-order:stroke fill;}
  .piece.white{color:#faf7ef; -webkit-text-stroke:2.5px #241206;
    text-shadow:0 1px 2px rgba(0,0,0,.4);}
  .piece.black{color:#141414; -webkit-text-stroke:2.5px #e7d7b4;
    text-shadow:0 1px 2px rgba(0,0,0,.45);}
  .sq.sel{box-shadow:inset 0 0 0 4px var(--sel);}
  .sq.lastmove{box-shadow:inset 0 0 0 4px rgba(111,174,95,.7);}
  .sq.check{box-shadow:inset 0 0 0 4px var(--check);}
  .dot{position:absolute; width:30%; height:30%; border-radius:50%;
    background:rgba(0,0,0,.28); pointer-events:none;}
  .sq.capture .dot{width:86%; height:86%; background:transparent;
    border:5px solid rgba(0,0,0,.3); border-radius:50%;}
  .coord{position:absolute; font-size:11px; font-weight:700; opacity:.55; pointer-events:none;}
  .coord.file{bottom:2px; right:4px;} .coord.rank{top:2px; left:4px;}
  .panel{background:var(--panel); border-radius:12px; padding:18px 20px; width:240px;
    height:720px; display:flex; flex-direction:column;
    box-shadow:0 8px 24px rgba(0,0,0,.4);}
  h1{font-size:22px; margin:0 0 4px;}
  .sub{opacity:.6; font-size:12px; margin-bottom:14px;}
  .status{font-size:16px; font-weight:600; min-height:44px; padding:10px 12px;
    background:#1c1f26; border-radius:8px; margin-bottom:14px; display:flex;
    align-items:center; gap:10px;}
  .turnDot{width:16px; height:16px; border-radius:50%; border:2px solid #888; flex:0 0 auto;}
  .btn{display:block; width:100%; padding:11px; margin-top:8px; border:0; border-radius:8px;
    font-size:14px; font-weight:600; cursor:pointer; background:var(--accent); color:#0e1a09;}
  .btn.sec{background:#3a3f4a; color:var(--text);}
  .btn:active{transform:translateY(1px);}
  .moves{margin-top:16px; flex:1; min-height:0; overflow:auto; font-size:13px;
    font-family:Consolas,monospace; background:#1c1f26; border-radius:8px; padding:8px 10px;}
  .moves div{padding:2px 0; display:flex; gap:8px;}
  .moves .n{opacity:.5; width:26px;}
  .promo{position:absolute; inset:0; background:rgba(0,0,0,.6); display:none;
    align-items:center; justify-content:center; border-radius:6px;}
  .promo.on{display:flex;}
  .promo .card{background:var(--panel); border-radius:12px; padding:16px; display:flex; gap:10px;}
  .promo .p{font-size:52px; cursor:pointer; padding:4px 8px; border-radius:8px;}
  .promo .p:hover{background:#3a3f4a;}
  .players{margin:10px 0 4px;}
  .players .pl{padding:7px 10px; margin-bottom:6px;
    background:#1c1f26; border-radius:8px; font-size:13px;}
  .players .pl.turn{background:#243026; box-shadow:inset 0 0 0 1px rgba(111,174,95,.5);}
  .players .plhead{display:flex; align-items:center; gap:8px;}
  .players .cap{margin-top:4px; font-size:17px; line-height:1.2; word-break:break-all;
    paint-order:stroke fill;}
  .players .cap.white{color:#faf7ef; -webkit-text-stroke:1px #241206;}
  .players .cap.black{color:#141414; -webkit-text-stroke:1px #9aa3b0;}
  .players .adv{font-size:12px; font-weight:700; color:var(--accent);
    -webkit-text-stroke:0; vertical-align:2px;}
  .players .dotc{width:12px; height:12px; border-radius:50%; border:1px solid #777; flex:0 0 auto;}
  .players .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .players .clk{font-family:Consolas,monospace; font-size:15px; font-weight:700;}
  .players .clk.low{color:var(--check);}
  .specs{margin-top:10px; font-size:12px; opacity:.6; line-height:1.5;}
  .evalbox{margin-top:10px; background:#1c1f26; border-radius:8px; padding:8px 10px;}
  .evalbar{height:10px; border-radius:5px; background:#141414; overflow:hidden;
    box-shadow:inset 0 0 0 1px #4a505c;}
  .evalbar .fill{height:100%; width:50%; background:#faf7ef; transition:width .25s;}
  .evalhead{display:flex; justify-content:space-between; align-items:baseline; margin-top:6px;}
  .evalhead #evalScore{font-family:Consolas,monospace; font-size:15px; font-weight:700;}
  .evalhead #evalDepth{font-size:11px; opacity:.5;}
  .evalpv{margin-top:3px; font-family:Consolas,monospace; font-size:11px; opacity:.7;
    line-height:1.4; min-height:15px;}
  .evallast{margin-top:6px; font-size:12px; font-weight:700; min-height:16px;}
  .q-best{color:#7fd88f;} .q-good{color:#9fd3a6;} .q-inac{color:#f0c14b;}
  .q-mist{color:#f09145;} .q-blun{color:#ff6b6b;}
  .moves .q{font-weight:700;}
  .lobby input{width:100%; padding:10px 12px; margin-bottom:12px; font-size:14px;
    border-radius:8px; border:1px solid #4a505c; background:#1c1f26; color:var(--text);}
  .tcrow{display:flex; gap:8px; margin-bottom:14px;}
  .tc{flex:1; padding:10px; border-radius:8px; border:1px solid #4a505c; cursor:pointer;
    background:#1c1f26; color:var(--text); font-size:13px; font-weight:600;}
  .tc.on{background:var(--accent); color:#0e1a09; border-color:var(--accent);}
  .lobby{position:fixed; inset:0; background:rgba(16,18,23,.88); display:none;
    align-items:center; justify-content:center; z-index:10;}
  .lobby.on{display:flex;}
  .lobby .card{background:var(--panel); border-radius:14px; padding:28px 32px;
    width:320px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.6);}
  .lobby h2{margin:0 0 6px; font-size:24px;}
  .lobby p{margin:0 0 18px; opacity:.65; font-size:13px;}
  .lobby .btn:disabled{opacity:.4; cursor:not-allowed;}
  .lobby .msg{min-height:18px; margin-top:12px; font-size:12px; color:var(--sel);}
  .btn.link{background:none; color:var(--text); opacity:.5; font-weight:400;
    font-size:12px; padding:6px;}
</style>
</head>
<body>
<div class="app">
  <div class="boardwrap">
    <div id="board"></div>
    <div class="promo" id="promo"><div class="card" id="promoCard"></div></div>
  </div>
  <div class="panel">
    <h1>♟ Schach</h1>
    <div class="sub">Hotseat &middot; 2 Spieler &middot; offline</div>
    <div class="status"><span class="turnDot" id="turnDot"></span><span id="status">Weiß am Zug</span></div>
    <div class="players" id="players"></div>
    <div class="tcrow" id="tcRow2" style="display:none">
      <button class="tc" data-tc="180+2">3 + 2</button>
      <button class="tc" data-tc="600+0">10 Min</button>
    </div>
    <button class="btn" id="startBtn" style="display:none">Spiel starten</button>
    <button class="btn" id="newBtn">Neues Spiel</button>
    <button class="btn sec" id="undoBtn">Zug zurück</button>
    <button class="btn sec" id="flipBtn">Brett drehen</button>
    <button class="btn sec" id="leaveBtn" style="display:none">Platz freigeben</button>
    <div class="evalbox" id="evalBox" style="display:none">
      <div class="evalbar"><div class="fill" id="evalFill"></div></div>
      <div class="evalhead"><span id="evalScore">…</span><span id="evalDepth"></span></div>
      <div class="evalpv" id="evalPv"></div>
      <div class="evallast" id="evalLast"></div>
    </div>
    <div class="specs" id="specs"></div>
    <div class="moves" id="moves"></div>
  </div>
</div>
<div class="lobby" id="lobby">
  <div class="card">
    <h2>♟ Schach</h2>
    <p>Name eingeben und Platz wählen</p>
    <input id="nameInput" maxlength="12" placeholder="Dein Name" autocomplete="off">
    <div class="tcrow" id="tcRow">
      <button class="tc on" data-tc="180+2">3 + 2</button>
      <button class="tc" data-tc="600+0">10 Min</button>
    </div>
    <button class="btn" id="seatW">Weiß spielen</button>
    <button class="btn" id="seatB">Schwarz spielen</button>
    <button class="btn sec" id="seatV">Nur zuschauen</button>
    <div class="msg" id="lobbyMsg"></div>
    <button class="btn link" id="resetSeats">Plätze zurücksetzen</button>
  </div>
</div>
<script>
"use strict";
/* ---------- Schach-Engine (vollständige Regeln, keine externen Libs) ---------- */
// Eine gefüllte Glyphe pro Figurtyp; Farbe wird per CSS-Klasse gesetzt,
// damit Weiß und Schwarz auf jedem Browser sicher unterscheidbar sind.
const GLYPH={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};

function initBoard(){
  const b=Array.from({length:8},()=>Array(8).fill(null));
  const back=['R','N','B','Q','K','B','N','R'];
  for(let c=0;c<8;c++){
    b[0][c]='b'+back[c]; b[1][c]='bP';
    b[6][c]='wP';        b[7][c]='w'+back[c];
  }
  return b;
}

let state, history, selected, legalCache, flipped=false;
// Eigene Farbe im PLC-Betrieb: 'w', 'b', 'v' (Zuschauer) oder null (beide Farben)
let mySide=null;

function newGame(){
  state={
    board:initBoard(), turn:'w',
    castle:{wK:true,wQ:true,bK:true,bQ:true},
    ep:null,                 // en-passant Zielfeld [r,c] oder null
    halfmove:0, fullmove:1
  };
  history=[]; selected=null; legalCache=null;
  if(Sync.transport){                    // im PLC-Betrieb zurück in die Aufstellung
    phase='setup'; result='';
    const b=tcParts().base; clock={w:b,b:b}; clockAt=Date.now();
  }
  render();
  Sync.publish();
  if(typeof renderPlayers==='function') renderPlayers();
}

const inside=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const colorOf=p=>p?p[0]:null;
const typeOf =p=>p?p[1]:null;

// Pseudo-legale Züge einer Figur (ohne Schach-Prüfung)
function pieceMoves(bd,r,c,st){
  const p=bd[r][c]; if(!p) return [];
  const col=p[0], t=p[1], dir=col==='w'?-1:1, out=[];
  const add=(rr,cc,flag)=>{ if(inside(rr,cc)) out.push({r:rr,c:cc,flag}); };

  if(t==='P'){
    // vorwärts
    if(inside(r+dir,c)&&!bd[r+dir][c]){
      add(r+dir,c);
      const start=col==='w'?6:1;
      if(r===start&&!bd[r+2*dir][c]) add(r+2*dir,c,'double');
    }
    // schlagen + en passant
    for(const dc of [-1,1]){
      const rr=r+dir,cc=c+dc;
      if(!inside(rr,cc)) continue;
      if(bd[rr][cc]&&bd[rr][cc][0]!==col) add(rr,cc,'capture');
      else if(st.ep&&st.ep[0]===rr&&st.ep[1]===cc) add(rr,cc,'ep');
    }
    return out;
  }
  if(t==='N'){
    for(const[dr,dc]of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]){
      const rr=r+dr,cc=c+dc;
      if(inside(rr,cc)&&(!bd[rr][cc]||bd[rr][cc][0]!==col)) add(rr,cc);
    }
    return out;
  }
  if(t==='K'){
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      if(!dr&&!dc)continue;
      const rr=r+dr,cc=c+dc;
      if(inside(rr,cc)&&(!bd[rr][cc]||bd[rr][cc][0]!==col)) add(rr,cc);
    }
    // Rochade wird in legalMoves() ergänzt (braucht Schach-Prüfung)
    return out;
  }
  // Gleiter: B,R,Q
  const dirs=[];
  if(t==='B'||t==='Q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
  if(t==='R'||t==='Q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
  for(const[dr,dc]of dirs){
    let rr=r+dr,cc=c+dc;
    while(inside(rr,cc)){
      if(!bd[rr][cc]){ add(rr,cc); }
      else{ if(bd[rr][cc][0]!==col) add(rr,cc,'capture'); break; }
      rr+=dr; cc+=dc;
    }
  }
  return out;
}

function findKing(bd,col){
  for(let r=0;r<8;r++)for(let c=0;c<8;c++) if(bd[r][c]===col+'K') return [r,c];
  return null;
}
function attacked(bd,r,c,byCol,st){
  for(let rr=0;rr<8;rr++)for(let cc=0;cc<8;cc++){
    const p=bd[rr][cc];
    if(p&&p[0]===byCol){
      // Für Angriffsprüfung: Bauern schlagen nur diagonal -> pieceMoves liefert
      // Schlagfelder korrekt (leere Diagonale wird nicht als Angriff gezählt,
      // aber ein König darf dort auch nicht hin -> wir prüfen Zielfeld separat).
      for(const m of pieceMoves(bd,rr,cc,st)){
        if(p[1]==='P'){ if(m.c!==cc && m.r===r && m.c===c) return true; }
        else if(m.r===r&&m.c===c) return true;
      }
    }
  }
  return false;
}
function inCheck(bd,col,st){
  const k=findKing(bd,col); if(!k) return false;
  return attacked(bd,k[0],k[1],col==='w'?'b':'w',st);
}

// wendet einen Zug auf eine Kopie an, gibt neuen Brett-/State zurück
function applyMove(st,from,to){
  const bd=st.board.map(row=>row.slice());
  const p=bd[from.r][from.c], col=p[0], t=p[1];
  const ns={board:bd, turn:col==='w'?'b':'w',
            castle:{...st.castle}, ep:null,
            halfmove:st.halfmove+1, fullmove:st.fullmove+(col==='b'?1:0)};
  let captured=bd[to.r][to.c];

  // en passant Schlag
  if(t==='P'&&to.flag==='ep'){ captured=bd[from.r][to.c]; bd[from.r][to.c]=null; }
  // Zug ausführen
  bd[to.r][to.c]=p; bd[from.r][from.c]=null;
  // Doppelschritt -> ep-Feld setzen
  if(t==='P'&&to.flag==='double') ns.ep=[(from.r+to.r)/2,from.c];
  // Umwandlung
  if(t==='P'&&(to.r===0||to.r===7)) bd[to.r][to.c]=col+(to.promo||'Q');
  // Rochade: Turm mitziehen
  if(t==='K'&&Math.abs(to.c-from.c)===2){
    const row=from.r;
    if(to.c===6){ bd[row][5]=bd[row][7]; bd[row][7]=null; }   // kurz
    else        { bd[row][3]=bd[row][0]; bd[row][0]=null; }   // lang
  }
  // Rochaderechte aktualisieren
  if(t==='K'){ ns.castle[col+'K']=false; ns.castle[col+'Q']=false; }
  if(t==='R'){
    if(from.c===0) ns.castle[col+'Q']=false;
    if(from.c===7) ns.castle[col+'K']=false;
  }
  // geschlagener Turm auf Ausgangsfeld -> Recht des Gegners löschen
  const oc=col==='w'?'b':'w';
  if(to.r===(oc==='w'?7:0)){
    if(to.c===0) ns.castle[oc+'Q']=false;
    if(to.c===7) ns.castle[oc+'K']=false;
  }
  if(t==='P'||captured) ns.halfmove=0;
  return {ns,captured};
}

// alle legalen Züge einer Farbe (mit Schach-Prüfung + Rochade)
function legalMoves(st,col){
  const res=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=st.board[r][c];
    if(!p||p[0]!==col) continue;
    for(const m of pieceMoves(st.board,r,c,st)){
      const from={r,c}, to={r:m.r,c:m.c,flag:m.flag};
      const {ns}=applyMove(st,from,to);
      if(!inCheck(ns.board,col,ns)) res.push({from,to});
    }
  }
  // Rochade
  const row=col==='w'?7:0;
  if(st.board[row][4]===col+'K' && !inCheck(st.board,col,st)){
    const enemy=col==='w'?'b':'w';
    // kurz
    if(st.castle[col+'K'] && !st.board[row][5] && !st.board[row][6] &&
       st.board[row][7]===col+'R' &&
       !attacked(st.board,row,5,enemy,st) && !attacked(st.board,row,6,enemy,st)){
      res.push({from:{r:row,c:4},to:{r:row,c:6,flag:'castle'}});
    }
    // lang
    if(st.castle[col+'Q'] && !st.board[row][1] && !st.board[row][2] && !st.board[row][3] &&
       st.board[row][0]===col+'R' &&
       !attacked(st.board,row,3,enemy,st) && !attacked(st.board,row,2,enemy,st)){
      res.push({from:{r:row,c:4},to:{r:row,c:2,flag:'castle'}});
    }
  }
  return res;
}

/* ---------- Notation ---------- */
const FILES='abcdefgh';
function sqName(r,c){ return FILES[c]+(8-r); }
function moveSAN(st,mv,promo){
  const p=st.board[mv.from.r][mv.from.c], t=p[1];
  if(mv.to.flag==='castle') return mv.to.c===6?'O-O':'O-O-O';
  const capture = st.board[mv.to.r][mv.to.c] || mv.to.flag==='ep';
  let s='';
  if(t==='P'){ if(capture) s+=FILES[mv.from.c]+'x'; s+=sqName(mv.to.r,mv.to.c);
               if(mv.to.r===0||mv.to.r===7) s+='='+(promo||'Q'); }
  else{ s+=t; if(capture) s+='x'; s+=sqName(mv.to.r,mv.to.c); }
  return s;
}

/* ---------- Rendering & Interaktion ---------- */
const boardEl=document.getElementById('board');
const statusEl=document.getElementById('status');
const turnDot=document.getElementById('turnDot');
const movesEl=document.getElementById('moves');
const promoEl=document.getElementById('promo');
const promoCard=document.getElementById('promoCard');

function currentLegal(){ if(!legalCache) legalCache=legalMoves(state,state.turn); return legalCache; }

function render(){
  boardEl.innerHTML='';
  const last=history.length?history[history.length-1].mv:null;
  const checkNow=inCheck(state.board,state.turn,state);
  const kingPos=checkNow?findKing(state.board,state.turn):null;
  const sel=selected;
  const targets = sel ? currentLegal().filter(m=>m.from.r===sel.r&&m.from.c===sel.c) : [];

  for(let vr=0;vr<8;vr++)for(let vc=0;vc<8;vc++){
    const r=flipped?7-vr:vr, c=flipped?7-vc:vc;
    const sq=document.createElement('div');
    sq.className='sq '+((r+c)%2===0?'light':'dark');
    sq.dataset.r=r; sq.dataset.c=c;
    const p=state.board[r][c];
    if(p){ const sp=document.createElement('span');
           sp.className='piece '+(p[0]==='w'?'white':'black');
           sp.textContent=GLYPH[p[1]]; sq.appendChild(sp); }
    if(sel&&sel.r===r&&sel.c===c) sq.classList.add('sel');
    if(last&&((last.from.r===r&&last.from.c===c)||(last.to.r===r&&last.to.c===c)))
      sq.classList.add('lastmove');
    if(kingPos&&kingPos[0]===r&&kingPos[1]===c) sq.classList.add('check');
    const tgt=targets.find(m=>m.to.r===r&&m.to.c===c);
    if(tgt){ const d=document.createElement('div'); d.className='dot'; sq.appendChild(d);
             if(state.board[r][c]||tgt.to.flag==='ep') sq.classList.add('capture'); }
    // Koordinaten am Rand
    if(vc===0){ const cr=document.createElement('div'); cr.className='coord rank';
                cr.textContent=8-r; sq.appendChild(cr); }
    if(vr===7){ const cf=document.createElement('div'); cf.className='coord file';
                cf.textContent=FILES[c]; sq.appendChild(cf); }
    sq.addEventListener('click',()=>onSquare(r,c));
    boardEl.appendChild(sq);
  }
  // Status
  const legal=currentLegal();
  const side=state.turn==='w'?'Weiß':'Schwarz';
  turnDot.style.background=state.turn==='w'?'#f2efe7':'#111';
  if(Sync.transport && phase==='over' && result){
    statusEl.textContent=result;
  } else if(Sync.transport && phase==='setup'){
    statusEl.textContent = (seats.w&&seats.b) ? 'Bereit – Spiel starten'
                                              : 'Warte auf Mitspieler …';
  } else if(legal.length===0){
    statusEl.textContent = checkNow
      ? 'Schachmatt - '+(state.turn==='w'?'Schwarz':'Weiß')+' gewinnt!'
      : 'Patt – Remis.';
  } else if(mySide==='v'){
    statusEl.textContent = side+' am Zug'+(checkNow?' – Schach!':'');
  } else if(mySide){
    statusEl.textContent = (mySide===state.turn ? 'Du bist am Zug' : 'Gegner am Zug')
                           +(checkNow?' – Schach!':'');
  } else {
    statusEl.textContent = side+' am Zug'+(checkNow?' – Schach!':'');
  }
  boardEl.style.opacity = (mySide && mySide!==state.turn && legal.length) ? '.85' : '1';
  renderMoves();
  renderPlayers();          // Namen, Uhren und geschlagene Figuren aktualisieren
  updateEval();             // Zuschauer: Bewertung zur neuen Stellung
}

// Ein Zug in der Liste, ggf. mit Einstufungs-Symbol der Analyse
function moveSpan(i){
  const el=document.createElement('span');
  el.textContent=history[i].san;
  const q=quality[i];
  if(q&&q.s){ const s=document.createElement('span');
              s.className='q '+q.c; s.textContent=q.s; el.appendChild(s); }
  return el;
}
function renderMoves(){
  movesEl.innerHTML='';
  for(let i=0;i<history.length;i+=2){
    const row=document.createElement('div');
    const n=document.createElement('span'); n.className='n'; n.textContent=(i/2+1)+'.';
    row.appendChild(n); row.appendChild(moveSpan(i));
    if(history[i+1]) row.appendChild(moveSpan(i+1));
    movesEl.appendChild(row);
  }
  movesEl.scrollTop=movesEl.scrollHeight;
}

function onSquare(r,c){
  if(currentLegal().length===0) return;   // Partie beendet
  if(mySide && mySide!==state.turn) return;   // fremde Farbe / Zuschauer
  if(Sync.transport && phase!=='run') return; // Partie noch nicht gestartet / beendet
  const p=state.board[r][c];
  if(selected){
    const mv=currentLegal().find(m=>m.from.r===selected.r&&m.from.c===selected.c
                                   &&m.to.r===r&&m.to.c===c);
    if(mv){ doMove(mv); return; }
  }
  if(p&&p[0]===state.turn){ selected={r,c}; render(); }
  else { selected=null; render(); }
}

function doMove(mv){
  const p=state.board[mv.from.r][mv.from.c];
  // Umwandlung -> Auswahl
  if(p[1]==='P'&&(mv.to.r===0||mv.to.r===7)){
    askPromotion(state.turn,(choice)=>finishMove(mv,choice));
    return;
  }
  finishMove(mv,null);
}
function finishMove(mv,promo){
  const to={...mv.to}; if(promo) to.promo=promo;
  const san=moveSAN(state,{from:mv.from,to},promo);
  const {ns}=applyMove(state,mv.from,to);
  history.push({mv:{from:mv.from,to:{r:to.r,c:to.c}},san});
  state=ns; selected=null; legalCache=null;
  // Schach/Matt-Suffix
  const chk=inCheck(state.board,state.turn,state);
  const noMoves=legalMoves(state,state.turn).length===0;
  const h=history[history.length-1];
  if(noMoves&&chk) h.san+='#'; else if(chk) h.san+='+';
  if(!Sync.suppress){
    const mover=(state.turn==='w')?'b':'w';        // wer gerade gezogen hat
    chargeClock(mover);
    if(Sync.transport&&noMoves){                   // Matt oder Patt beendet die Partie
      phase='over';
      result = chk ? 'Schachmatt - '+(names[mover]||(mover==='w'?'Weiß':'Schwarz'))+' gewinnt'
                   : 'Patt - Remis';
    }
    render(); Sync.publish();
  }
}

function askPromotion(col,cb){
  promoCard.innerHTML='';
  for(const t of ['Q','R','B','N']){
    const el=document.createElement('div'); el.className='p '+(col==='w'?'white':'black');
    el.textContent=GLYPH[t];
    el.addEventListener('click',()=>{ promoEl.classList.remove('on'); cb(t); });
    promoCard.appendChild(el);
  }
  promoEl.classList.add('on');
}

function undo(){
  if(!history.length) return;
  history.pop();
  // Zustand neu aufbauen (einfach & robust)
  const saved=history.slice();
  newGameSilent();
  history=[];
  Sync.suppress=true;
  for(const h of saved){
    const legal=legalMoves(state,state.turn);
    const mv=legal.find(m=>m.from.r===h.mv.from.r&&m.from.c===h.mv.from.c
                          &&m.to.r===h.mv.to.r&&m.to.c===h.mv.to.c);
    const promo=/=([QRBN])/.exec(h.san);
    finishMove(mv,promo?promo[1]:null);
  }
  Sync.suppress=false;
  selected=null; legalCache=null; render(); Sync.publish();
}
function newGameSilent(){
  state={board:initBoard(),turn:'w',
    castle:{wK:true,wQ:true,bK:true,bQ:true},ep:null,halfmove:0,fullmove:1};
  history=[]; selected=null; legalCache=null;
}

/* ---------- Synchronisation (zwei Clients, ein Brett) ----------
   Der komplette Spielverlauf wird als Zugliste serialisiert (z.B.
   "e2e4 e7e5 g1f3"). Beide Seiten bauen daraus dasselbe Brett auf.
   Sync.transport wird vom Host gesetzt:
     - im mapp-View-Custom-Widget: Bindung an eine PLC-STRING-Variable
     - im lokalen Demo (?demo in der URL): BroadcastChannel zwischen Tabs */
function parseSq(s){ return {c:FILES.indexOf(s[0]), r:8-parseInt(s[1],10)}; }
function serializeGame(){
  return history.map(h=>{
    const f=sqName(h.mv.from.r,h.mv.from.c), t=sqName(h.mv.to.r,h.mv.to.c);
    const pr=/=([QRBN])/.exec(h.san);
    return f+t+(pr?pr[1].toLowerCase():'');
  }).join(' ');
}
function loadGame(str){
  newGameSilent();
  const codes=(str||'').trim() ? str.trim().split(/\s+/) : [];
  Sync.suppress=true;
  for(const code of codes){
    const from=parseSq(code.slice(0,2)), to=parseSq(code.slice(2,4));
    const promo=code.length>4?code[4].toUpperCase():null;
    const mv=legalMoves(state,state.turn).find(m=>
      m.from.r===from.r&&m.from.c===from.c&&m.to.r===to.r&&m.to.c===to.c);
    if(!mv) break;                 // ungültiger Code -> Rest ignorieren
    finishMove(mv,promo);
  }
  Sync.suppress=false;
  selected=null; legalCache=null;
}
/* Gemeinsamer Zustand in EINER SPS-Variable:
   "w=id:Name;b=id:Name;v=id:Name,id:Name;tc=180+2;tw=180000;tb=180000;st=run|e2e4 e7e5"
   Kopf = Plätze, Namen, Zuschauer, Zeitmodus und Restzeiten; danach die Zugliste. */
const seats={w:'',b:''};                   // Platz-Kennungen
const names={w:'',b:''};                   // Spielernamen
let specs=[];                              // Zuschauer [{id,name}]
let tc='180+2';                            // Zeitmodus "Sekunden+Inkrement"
let clock={w:0,b:0};                       // Restzeiten in ms
let phase='setup';                         // setup | run | over
let result='';                             // Ergebnistext bei phase==='over'

const MAXSPECS=8;                          // Begrenzung, damit der String klein bleibt
function clean(s){ return String(s||'').replace(/[;:,|=]/g,'').trim().slice(0,12); }
function tcParts(){ const p=tc.split('+'); return {base:(+p[0]||180)*1000, inc:(+p[1]||0)*1000}; }

function serializeState(){
  const ent=(id,nm)=>id?(id+':'+nm):'';
  const f=['w='+ent(seats.w,names.w), 'b='+ent(seats.b,names.b),
           'v='+specs.slice(0,MAXSPECS).map(s=>s.id+':'+s.name).join(','),
           'tc='+tc, 'tw='+Math.max(0,Math.round(clock.w)),
           'tb='+Math.max(0,Math.round(clock.b)), 'st='+phase];
  if(result) f.push('res='+result.replace(/[;|]/g,''));
  return f.join(';')+'|'+serializeGame();
}
function parseState(str){
  const s=String(str||''), i=s.indexOf('|');
  const out={w:'',b:'',nw:'',nb:'',specs:[],tc:'180+2',tw:0,tb:0,st:'setup',res:'',
             moves:i<0?s.trim():s.slice(i+1).trim()};
  if(i<0) return out;                              // ganz altes Format: nur Züge
  const head=s.slice(0,i);
  if(head.indexOf('=')<0){                         // Vorversion: "<id-w>,<id-b>"
    const p=head.split(','); out.w=(p[0]||'').trim(); out.b=(p[1]||'').trim(); return out;
  }
  for(const part of head.split(';')){
    const k=part.slice(0,part.indexOf('=')), v=part.slice(part.indexOf('=')+1);
    if(k==='w'||k==='b'){ const c=v.split(':');
      out[k]=(c[0]||'').trim(); out['n'+k]=(c[1]||'').trim(); }
    else if(k==='v'){ out.specs=v?v.split(',').filter(Boolean).map(e=>{
      const c=e.split(':'); return {id:(c[0]||'').trim(), name:(c[1]||'').trim()}; }):[]; }
    else if(k==='tc') out.tc=v||'180+2';
    else if(k==='tw') out.tw=+v||0;
    else if(k==='tb') out.tb=+v||0;
    else if(k==='st') out.st=v||'setup';
    else if(k==='res') out.res=v||'';
  }
  return out;
}
const Sync={
  transport:null, suppress:false, last:null,
  ready:true,                    // erst nach dem ersten Abgleich darf publiziert werden
  publish(){ if(this.transport&&!this.suppress){ const s=serializeState();
             this.last=s; this.transport.send(s); } },
  receive(str){
    if(str===this.last) return;                   // eigener Echo -> ignorieren
    this.last=str;
    applyState(parseState(str));
  }
};
// Übernimmt einen empfangenen Zustand vollständig
function applyState(st){
  seats.w=st.w; seats.b=st.b; names.w=st.nw; names.b=st.nb;
  specs=st.specs; tc=st.tc; phase=st.st; result=st.res;
  clock.w=st.tw; clock.b=st.tb; clockAt=Date.now();   // Basis fürs lokale Ticken
  if(st.moves!==serializeGame()) loadGame(st.moves);
  if(mySide==='w'&&seats.w!==myId) leaveSeat(true);        // Platz verloren
  else if(mySide==='b'&&seats.b!==myId) leaveSeat(true);
  render(); renderLobby();
}
window.ChessSync=Sync;             // Zugriffspunkt für externe Transports

/* ---------- Schachuhr ----------
   Nur die Seite am Zug verbraucht Zeit. Jeder Client zählt lokal ab dem
   Moment herunter, in dem er den Zustand empfangen hat (clockAt) – dadurch
   ist keine Uhrzeit-Synchronisation zwischen den PCs nötig. Verbindlich
   rechnet der Spieler ab, der zieht: er schreibt seine neue Restzeit mit. */
let clockAt=Date.now();
function liveClock(col){
  if(phase!=='run'||col!==state.turn) return clock[col];
  return clock[col]-(Date.now()-clockAt);
}
function fmtClock(ms){
  if(ms<0) ms=0;
  const t=Math.ceil(ms/1000), m=Math.floor(t/60), s=t%60;
  return m+':'+(s<10?'0':'')+s;
}
function chargeClock(col){                  // Zeit des ziehenden Spielers abrechnen
  if(phase!=='run') return;
  const now=Date.now();
  clock[col]=Math.max(0,clock[col]-(now-clockAt))+tcParts().inc;
  clockAt=now;
}
function startGame(){
  const b=tcParts().base;
  clock={w:b,b:b}; clockAt=Date.now(); phase='run'; result='';
  newGameSilent(); render(); renderLobby(); Sync.publish();
}
function endGame(text){
  phase='over'; result=text; render(); renderLobby(); Sync.publish();
}
function tickClocks(){
  if(!Sync.transport) return;
  renderPlayers();
  if(phase!=='run') return;
  const t=state.turn, left=liveClock(t);
  if(left>0) return;
  // Der Spieler am Zug meldet selbst; ist sein PC weg, meldet der Gegner nach 5 s
  const iMove=(mySide===t), iWait=(mySide&&mySide!=='v'&&mySide!==t&&left<=-5000);
  if(iMove||iWait){
    clock[t]=0;
    endGame('Zeit abgelaufen - '+(t==='w'?names.b||'Schwarz':names.w||'Weiß')+' gewinnt');
  }
}
setInterval(tickClocks,200);

/* Geschlagene Figuren: was auf dem Brett gegenüber der Grundstellung fehlt */
const VALUE={Q:9,R:5,B:3,N:3,P:1};
function capturedBy(col){
  const enemy=col==='w'?'b':'w';
  const start={Q:1,R:2,B:2,N:2,P:8}, cur={Q:0,R:0,B:0,N:0,P:0};
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=state.board[r][c];
    if(p&&p[0]===enemy&&cur[p[1]]!==undefined) cur[p[1]]++;
  }
  const out=[]; let pts=0;
  for(const t of ['Q','R','B','N','P']){
    const n=Math.max(0,start[t]-cur[t]);
    for(let i=0;i<n;i++) out.push(t);
    pts+=n*VALUE[t];
  }
  return {list:out, pts};
}

function renderPlayers(){
  const el=document.getElementById('players');
  if(!el) return;
  const plc=!!Sync.transport;
  const capW=capturedBy('w'), capB=capturedBy('b');
  el.innerHTML='';
  for(const col of ['w','b']){
    const row=document.createElement('div');
    row.className='pl'+(col===state.turn&&(!plc||phase==='run')?' turn':'');
    const head=document.createElement('div'); head.className='plhead';
    const dot=document.createElement('span'); dot.className='dotc';
    dot.style.background=col==='w'?'#f2efe7':'#111';

    nm.textContent = plc ? (names[col]||(seats[col]?'Spieler':'frei'))+(seats[col]===myId?' (du)':'')
                         : (col==='w'?'Weiß':'Schwarz');
    head.appendChild(dot); head.appendChild(nm);
    if(plc){
      const ck=document.createElement('span'); ck.className='clk';
      const ms=liveClock(col); ck.textContent=fmtClock(ms);
      if(phase==='run'&&ms<30000) ck.classList.add('low');
      head.appendChild(ck);
    }
    row.appendChild(head);
    // geschlagene Figuren dieses Spielers + Materialvorsprung
    const cap=(col==='w')?capW:capB, diff=capW.pts-capB.pts;
    const adv=(col==='w')?diff:-diff;
    if(cap.list.length||adv>0){
      const cw=document.createElement('div'); cw.className='cap';
      cw.textContent=cap.list.map(t=>GLYPH[t]).join('');
      cw.classList.add(col==='w'?'black':'white');   // erbeutete Farbe = Gegnerfarbe
      if(adv>0){ const s=document.createElement('span'); s.className='adv';
                 s.textContent=' +'+adv; cw.appendChild(s); }
      row.appendChild(cw);
    }
    el.appendChild(row);
  }
  const sp=document.getElementById('specs');
  if(!plc){ sp.textContent=''; return; }
  sp.textContent = specs.length
    ? 'Zuschauer: '+specs.map(s=>s.name||'Gast').join(', ')
    : 'Keine Zuschauer';

  const row2=document.getElementById('tcRow2');
  if(row2) row2.style.display=canStart?'flex':'none';
  renderTC();
}
function renderTC(){
  for(const btn of document.querySelectorAll('.tc'))
    btn.classList.toggle('on',btn.dataset.tc===tc);
}
function setTC(v){
  if(phase==='run') return;
  tc=v; const b=tcParts().base; clock={w:b,b:b}; clockAt=Date.now();
  renderTC(); renderPlayers();
  if(mySide==='w'||mySide==='b') Sync.publish();
}

/* ---------- Stellungsbewertung für Zuschauer (Stockfish, lokal) ----------
   Nutzt stockfish-18-lite-single.js/.wasm aus demselben Verzeichnis. Fehlen
   die Dateien, bleibt die Anzeige einfach aus – das Spiel läuft normal. */
const ENGINE_FILE='stockfish-18-lite-single.js';
let sf=null, sfReady=false, sfSeen='', sfOff=false;
// Zugbewertung: Bewertung vor dem Zug gegen die nach dem Zug halten
const RATE_DEPTH=13;                 // ab dieser Tiefe gilt ein Wert als belastbar
let evalCur={moves:null,cp:null};    // laufende Analyse (cp aus Weiß-Sicht)
let evalPrev=null;                   // Bewertung der Vorgängerstellung
let quality=[];                      // Einstufung je Halbzug
function scoreCp(sc){                // Matt in eine Zentibauern-Zahl übersetzen
  return sc.mate!==undefined ? (sc.mate>0?1:-1)*(10000-Math.abs(sc.mate)*10) : sc.cp;
}
function classify(loss){
  if(loss<20)  return {t:'Bester Zug', s:'',   c:'q-best'};
  if(loss<50)  return {t:'Gut',        s:'',   c:'q-good'};
  if(loss<100) return {t:'Ungenau',    s:'?!', c:'q-inac'};
  if(loss<200) return {t:'Fehler',     s:'?',  c:'q-mist'};
  return             {t:'Grober Fehler',s:'??',c:'q-blun'};
}

function engineOn(){
  if(sf||sfOff) return;
  try{ sf=new Worker(ENGINE_FILE); }catch(e){ sfOff=true; return; }
  sf.onerror=()=>{ sfOff=true; sf=null; document.getElementById('evalBox').style.display='none'; };
  sf.onmessage=(e)=>onEngine(typeof e.data==='string'?e.data:'');
  sf.postMessage('uci');
}
function engineOff(){
  if(sf){ try{ sf.postMessage('stop'); sf.terminate(); }catch(e){} }
  sf=null; sfReady=false; sfSeen='';
}
function onEngine(line){
  if(line==='uciok'){ sfReady=true; analyse(true); return; }
  if(line.indexOf('info ')!==0 || line.indexOf(' pv ')<0) return;
  const mate=/score mate (-?\d+)/.exec(line), cp=/score cp (-?\d+)/.exec(line);
  const dep=/ depth (\d+)/.exec(line);
  const pv=line.slice(line.indexOf(' pv ')+4).trim().split(/\s+/);
  // Werte kommen aus Sicht der Seite am Zug -> auf Weiß-Sicht drehen
  const sign=(state.turn==='w')?1:-1;
  const sc=mate?{mate:sign*(+mate[1])}:cp?{cp:sign*(+cp[1])}:null;
  const depth=dep?+dep[1]:0;
  if(sc){ evalCur.cp=scoreCp(sc); if(depth>=RATE_DEPTH) rateLastMove(); }
  showEval(sc,depth,pv);
}
// Den zuletzt gespielten Zug einstufen, sobald die neue Stellung bewertet ist
function rateLastMove(){
  const i=history.length-1;
  if(i<0||!evalPrev||quality[i]) return;
  const mover=(state.turn==='w')?'b':'w';          // wer gerade gezogen hat
  const before=evalPrev.cp, after=evalCur.cp;
  const loss=(mover==='w')?(before-after):(after-before);
  quality[i]=classify(Math.max(0,loss));
  quality[i].san=history[i].san;
  renderMoves(); showLastQuality();
}
function showLastQuality(){
  const el=document.getElementById('evalLast');
  if(!el) return;
  const q=quality[history.length-1];
  el.className='evallast'+(q?' '+q.c:'');
  el.textContent=q?('Letzter Zug: '+q.san+' – '+q.t):'';
}
function showEval(sc,depth,pv){
  const box=document.getElementById('evalBox');
  if(!sc||box.style.display==='none') return;
  let txt, frac;
  if(sc.mate!==undefined){
    txt=(sc.mate>0?'+':'-')+'M'+Math.abs(sc.mate); frac=sc.mate>0?1:0;
  }else{
    const p=sc.cp/100;
    txt=(p>0?'+':'')+p.toFixed(2);
    frac=1/(1+Math.pow(10,-sc.cp/400));            // Gewinnwahrscheinlichkeit Weiß
  }
  document.getElementById('evalScore').textContent=txt;
  document.getElementById('evalDepth').textContent='Tiefe '+depth;
  document.getElementById('evalFill').style.width=Math.round(frac*100)+'%';
  document.getElementById('evalPv').textContent=pvSan(pv,6);
}
// Hauptvariante in lesbare Notation umsetzen
function pvSan(uci,n){
  let st=state; const out=[];
  for(const code of uci.slice(0,n)){
    if(!/^[a-h][1-8][a-h][1-8]/.test(code)) break;
    const from=parseSq(code.slice(0,2)), to=parseSq(code.slice(2,4));
    const promo=code.length>4?code[4].toUpperCase():null;
    const mv=legalMoves(st,st.turn).find(m=>m.from.r===from.r&&m.from.c===from.c
                                           &&m.to.r===to.r&&m.to.c===to.c);
    if(!mv) break;
    const t={...mv.to}; if(promo) t.promo=promo;
    out.push(moveSAN(st,{from:mv.from,to:t},promo));
    st=applyMove(st,mv.from,t).ns;
  }
  return out.join(' ');
}
function analyse(force){
  if(!sf||!sfReady) return;
  const moves=serializeGame();
  if(!force && moves===sfSeen) return;
  // Ist die neue Stellung genau einen Zug weiter, dient die bisherige
  // Bewertung als Referenz für die Einstufung dieses Zuges.
  const prev=evalCur.moves;
  let oneMore=false;
  if(prev!==null && moves!==prev){
    oneMore = prev==='' ? (moves!==''&&moves.indexOf(' ')<0)
                        : (moves.indexOf(prev+' ')===0 &&
                           moves.slice(prev.length+1).indexOf(' ')<0);
  }
  evalPrev=(oneMore&&evalCur.cp!==null)?{cp:evalCur.cp}:null;
  if(prev!==null && moves!==prev && !oneMore) quality=[];   // neues Spiel / Rücknahme
  evalCur={moves,cp:null};
  sfSeen=moves;
  showLastQuality();
  if(currentLegal().length===0){                   // Partie vorbei -> nichts rechnen
    document.getElementById('evalPv').textContent='';
    document.getElementById('evalDepth').textContent='';
    return;
  }
  sf.postMessage('stop');
  sf.postMessage('position startpos'+(moves?' moves '+moves:''));
  sf.postMessage('go depth 14');
}
function updateEval(){                             // nur Zuschauer sehen die Analyse
  const box=document.getElementById('evalBox');
  if(!box) return;
  const want=(mySide==='v');
  box.style.display=(want&&!sfOff)?'block':'none';
  if(want){ engineOn(); analyse(false); } else if(sf) engineOff();
}

/* ---------- Lobby: Platz wählen oder zuschauen ---------- */
// Kennung dieses Browsers; übersteht Reload, damit der Platz erhalten bleibt.
let myId=null;
try{
  myId=sessionStorage.getItem('chessId');
  if(!myId){ myId='p'+Math.random().toString(36).slice(2,8); sessionStorage.setItem('chessId',myId); }
}catch(e){ myId='p'+Math.random().toString(36).slice(2,8); }

const lobbyEl=document.getElementById('lobby');
const seatInfoEl=document.getElementById('seatInfo');
const leaveBtn=document.getElementById('leaveBtn');
let lobbyMsg='';

function seatFree(col){ return !seats[col] || seats[col]===myId; }
function showLobby(){ if(lobbyEl) lobbyEl.classList.add('on'); renderLobby(); }
function hideLobby(){ if(lobbyEl) lobbyEl.classList.remove('on'); }

function renderLobby(){
  if(!lobbyEl) return;
  for(const col of ['w','b']){
    const btn=document.getElementById('seat'+col.toUpperCase());
    if(!btn) continue;
    const taken=seats[col]&&seats[col]!==myId;
    btn.disabled=!!taken||!Sync.ready;
    btn.textContent=(col==='w'?'Weiß spielen':'Schwarz spielen')+(taken?' — besetzt':'');
  }
  const rs=document.getElementById('resetSeats'); if(rs) rs.disabled=!Sync.ready;
  const m=document.getElementById('lobbyMsg');
  if(m) m.textContent=Sync.ready?lobbyMsg:'Verbinde mit der Steuerung …';
  if(seatInfoEl){
    const nm=(c)=>!seats[c]?'frei':(seats[c]===myId?'du':'besetzt');
    seatInfoEl.textContent='Weiß: '+nm('w')+' · Schwarz: '+nm('b');
  }
  if(leaveBtn){                       // Zuschauer kommen so zur Platzwahl zurück
    leaveBtn.style.display=mySide?'block':'none';
    leaveBtn.textContent=(mySide==='v')?'Platz wählen':'Platz freigeben';
  }
}

function applySide(){
  flipped = (mySide==='b');
  const sub=document.querySelector('.sub');
  if(sub) sub.textContent = mySide==='w' ? 'Du spielst Weiß'
                          : mySide==='b' ? 'Du spielst Schwarz'
                          : mySide==='v' ? 'Zuschauer'
                          : 'Zwei PCs · ein Brett';
  const hide=(mySide==='v');
  for(const id of ['newBtn','undoBtn']){
    const b=document.getElementById(id); if(b) b.style.display=hide?'none':'block';
  }
  render(); renderLobby(); renderPlayers();
}

function myName(){
  const el=document.getElementById('nameInput');
  const n=clean(el&&el.value);
  if(n){ try{ sessionStorage.setItem('chessName',n); }catch(e){} }
  return n;
}
function dropMe(){ specs=specs.filter(s=>s.id!==myId); }

function takeSeat(col){
  if(!seatFree(col)){ lobbyMsg='Platz ist bereits belegt.'; renderLobby(); return; }
  const n=myName();
  if(!n){ lobbyMsg='Bitte zuerst einen Namen eingeben.'; renderLobby(); return; }
  dropMe();
  seats[col]=myId; names[col]=n; mySide=col; lobbyMsg='';
  // Sitzt der Gegner noch in einer laufenden Partie, wird sie übernommen –
  // sonst (Partie beendet oder verwaist) beginnt eine frische Aufstellung.
  const takeover = phase==='run' && !!seats[col==='w'?'b':'w'];
  if(!takeover){
    newGameSilent(); phase='setup'; result='';
    const b=tcParts().base; clock={w:b,b:b}; clockAt=Date.now();
  }
  Sync.publish();
  hideLobby(); applySide();
  // Gleichzeitige Anmeldung: nach einem Abgleich prüfen, ob der Platz hält
  setTimeout(()=>{
    if(mySide===col && seats[col]!==myId){
      lobbyMsg='Ein anderer Spieler war schneller.'; leaveSeat(true);
    }
  },2500);
}
function watchOnly(){
  const n=myName();
  if(!n){ lobbyMsg='Bitte zuerst einen Namen eingeben.'; renderLobby(); return; }
  dropMe();
  if(specs.length<MAXSPECS) specs.push({id:myId,name:n});
  mySide='v'; lobbyMsg=''; Sync.publish(); hideLobby(); applySide();
}
function leaveSeat(lost){
  if(mySide==='w'||mySide==='b'){
    if(seats[mySide]===myId){ seats[mySide]=''; names[mySide]=''; if(!lost) Sync.publish(); }
  } else if(mySide==='v'){ dropMe(); Sync.publish(); }
  mySide=null; applySide(); showLobby();
}
function resetSeats(){
  seats.w=''; seats.b=''; names.w=''; names.b=''; specs=[];
  newGameSilent(); phase='setup'; result='';
  const b=tcParts().base; clock={w:b,b:b}; clockAt=Date.now();
  lobbyMsg=''; Sync.publish(); render(); renderLobby(); renderPlayers();
}

/* ---------- PLC-Transport (zwei PCs, ein Brett) ----------
   Synchronisiert über eine STRING-Variable der Steuerung, gelesen/geschrieben
   über den B&R-AR-Webserver (goform/ReadWrite, Format aus PV_Access.js).
   Voraussetzung: response.asp liegt im Webverzeichnis (web\).
   Aktivierung mit ?plc in der URL; PV-Name via ?pv=... (Default gChessState). */
function setupPLC(){
  const params=new URLSearchParams(location.search);
  const pv=params.get('pv')||'gChessState';
  const G='/goform/ReadWrite';
  const body=(tail)=>'redirect=/response.asp&variable='+encodeURIComponent(pv)+tail;
  async function write(val){
    try{ await fetch(G,{method:'POST',body:body('&value='+encodeURIComponent(val)+'&write=1')}); }
    catch(e){/* Netzwerk-Hänger ignorieren, Spiel läuft lokal weiter */}
  }
  async function read(){
    const r=await fetch(G,{method:'POST',body:body('&value=none&read=1')});
    return (await r.text()).replace('<!-- B&R ASP Webserver -->','').trim();
  }
  Sync.transport={ send:write };
  Sync.ready=false;          // bis zum ersten Abgleich nichts überschreiben

  const side=(params.get('side')||'').toLowerCase().charAt(0);
  applySide(); showLobby();

  let busy=false;
  async function poll(){
    if(busy) return; busy=true;
    try{
      const remote=await read();
      const first=!Sync.ready;
      if(first){ Sync.last=remote;
                 applyState(parseState(remote));   // Namen, Uhren, Modus mit übernehmen
                 Sync.ready=true; renderLobby();
                 // Platz aus der URL erst jetzt belegen – Stand ist bekannt
                 if(side==='w'||side==='b') takeSeat(side);
                 else if(side==='v') watchOnly();
      } else if(remote!==Sync.last){ Sync.receive(remote); }
    }catch(e){}
    busy=false;
  }
  poll();                    // aktuellen Stand von der PLC übernehmen
  setInterval(poll,1000);    // danach ~1x pro Sekunde abgleichen
}

try{ const n=sessionStorage.getItem('chessName');
     if(n) document.getElementById('nameInput').value=n; }catch(e){}
for(const btn of document.querySelectorAll('.tc'))
  btn.addEventListener('click',()=>setTC(btn.dataset.tc));
document.getElementById('startBtn').addEventListener('click',startGame);

document.getElementById('seatW').addEventListener('click',()=>takeSeat('w'));
document.getElementById('seatB').addEventListener('click',()=>takeSeat('b'));
document.getElementById('seatV').addEventListener('click',watchOnly);
document.getElementById('resetSeats').addEventListener('click',resetSeats);
leaveBtn.addEventListener('click',()=>leaveSeat(false));

document.getElementById('newBtn').addEventListener('click',newGame);
document.getElementById('undoBtn').addEventListener('click',undo);
document.getElementById('flipBtn').addEventListener('click',()=>{flipped=!flipped;render();});

newGame();                   // frisches Brett – Transport hängt noch nicht -> kein Publish

// Transport nach newGame() wählen, damit der Start keinen Reset an den Peer sendet
const _q=location.search;
if(_q.indexOf('plc')>=0){
  setupPLC();
} else if(_q.indexOf('demo')>=0 && 'BroadcastChannel' in window){
  const bc=new BroadcastChannel('chess-sync');
  Sync.transport={ send:(s)=>bc.postMessage(s) };
  bc.onmessage=(e)=>Sync.receive(e.data);
}
</script>

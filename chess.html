<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schach</title>
<style>
  :root{
    --light:#e8d3a8; --dark:#9d6b3f; --bg:#20232a; --panel:#2b2f38;
    --text:#f2efe7; --accent:#6fae5f; --sel:#f6e05e; --move:#7fd8ff; --check:#ff6b6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg); color:var(--text); font-family:Segoe UI,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; height:100%;
    overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  .app{display:flex; gap:24px; align-items:stretch; justify-content:center;}
  .boardwrap{position:relative;}
  #board{
    display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr);
    width:720px; height:720px;
    border:6px solid #3c2f22; border-radius:6px; box-shadow:0 10px 30px rgba(0,0,0,.5);
    touch-action:manipulation;
  }
  .sq{position:relative; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .sq.light{background:var(--light);} .sq.dark{background:var(--dark);}
  /* Figuren bringen ihre Farben im Sprite mit */
  .piece,.promopiece,.cappiece{display:block; pointer-events:none; line-height:0;}
  .piece svg,.promopiece svg,.cappiece svg{width:100%; height:100%; display:block;}
  .sq .piece{width:92%; height:92%;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));}
  .promopiece{width:56px; height:56px;}
  .cappiece{display:inline-block; width:18px; height:18px; vertical-align:-4px;}
  .cappiece.black{filter:drop-shadow(0 0 1.2px rgba(255,255,255,.8));}
  .cappiece.white{filter:drop-shadow(0 0 1px rgba(0,0,0,.9));}
  .sq.sel{box-shadow:inset 0 0 0 4px var(--sel);}
  .sq.lastmove{box-shadow:inset 0 0 0 4px rgba(111,174,95,.7);}
  .sq.check{box-shadow:inset 0 0 0 4px var(--check);}
  .dot{position:absolute; width:30%; height:30%; border-radius:50%;
    background:rgba(0,0,0,.28); pointer-events:none;}
  .sq.capture .dot{width:86%; height:86%; background:transparent;
    border:5px solid rgba(0,0,0,.3); border-radius:50%;}
  .coord{position:absolute; font-size:11px; font-weight:700; opacity:.55; pointer-events:none;}
  .coord.file{bottom:2px; right:4px;} .coord.rank{top:2px; left:4px;}
  .panel{background:var(--panel); border-radius:12px; padding:18px 20px; width:240px;
    height:720px; display:flex; flex-direction:column;
    box-shadow:0 8px 24px rgba(0,0,0,.4);}
  h1{font-size:22px; margin:0 0 4px;}
  .sub{opacity:.6; font-size:12px; margin-bottom:14px;}
  .status{font-size:16px; font-weight:600; min-height:44px; padding:10px 12px;
    background:#1c1f26; border-radius:8px; margin-bottom:14px; display:flex;
    align-items:center; gap:10px;}
  .turnDot{width:16px; height:16px; border-radius:50%; border:2px solid #888; flex:0 0 auto;}
  .btn{display:block; width:100%; padding:11px; margin-top:8px; border:0; border-radius:8px;
    font-size:14px; font-weight:600; cursor:pointer; background:var(--accent); color:#0e1a09;}
  .btn.sec{background:#3a3f4a; color:var(--text);}
  .btn:active{transform:translateY(1px);}
  .moves{margin-top:16px; flex:1; min-height:0; overflow:auto; font-size:13px;
    font-family:Consolas,monospace; background:#1c1f26; border-radius:8px; padding:8px 10px;}
  .moves div{padding:2px 0; display:flex; gap:8px;}
  .moves .n{opacity:.5; width:26px;}
  .promo{position:absolute; inset:0; background:rgba(0,0,0,.6); display:none;
    align-items:center; justify-content:center; border-radius:6px;}
  .promo.on{display:flex;}
  .promo .card{background:var(--panel); border-radius:12px; padding:16px; display:flex; gap:10px;}
  .promo .p{font-size:52px; cursor:pointer; padding:4px 8px; border-radius:8px;}
  .promo .p:hover{background:#3a3f4a;}
  .players{margin:10px 0 4px;}
  .players .pl{padding:7px 10px; margin-bottom:6px;
    background:#1c1f26; border-radius:8px; font-size:13px;}
  .players .pl.turn{background:#243026; box-shadow:inset 0 0 0 1px rgba(111,174,95,.5);}
  .players .plhead{display:flex; align-items:center; gap:8px;}
  .players .cap{margin-top:4px; line-height:1; min-height:17px;}
  .players .adv{font-size:12px; font-weight:700; color:var(--accent);
    margin-left:5px; vertical-align:3px;}
  .promo .p{font-size:0; padding:6px; border-radius:8px;}
  .players .dotc{width:12px; height:12px; border-radius:50%; border:1px solid #777; flex:0 0 auto;}
  .players .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .players .clk{font-family:Consolas,monospace; font-size:15px; font-weight:700;}
  .players .clk.low{color:var(--check);}
  .specs{margin-top:10px; font-size:12px; opacity:.6; line-height:1.5;}
  .evalbox{margin-top:10px; background:#1c1f26; border-radius:8px; padding:8px 10px;}
  .evalbar{height:10px; border-radius:5px; background:#141414; overflow:hidden;
    box-shadow:inset 0 0 0 1px #4a505c;}
  .evalbar .fill{height:100%; width:50%; background:#faf7ef; transition:width .25s;}
  .evalhead{display:flex; justify-content:space-between; align-items:baseline; margin-top:6px;}
  .evalhead #evalScore{font-family:Consolas,monospace; font-size:15px; font-weight:700;}
  .evalhead #evalDepth{font-size:11px; opacity:.5;}
  .evalbest{margin-top:5px; font-size:13px; font-weight:700; color:#5b9ad5;
    min-height:17px;}
  .evalpv{margin-top:3px; font-family:Consolas,monospace; font-size:11px; opacity:.7;
    line-height:1.4; min-height:15px;}
  .sq.hintfrom{box-shadow:inset 0 0 0 4px rgba(91,154,213,.55);}
  .sq.hintto{box-shadow:inset 0 0 0 4px rgba(91,154,213,.95);}
  .undoask{margin-top:8px; background:#2f2a1c; border-radius:8px; padding:9px 10px;
    box-shadow:inset 0 0 0 1px rgba(246,224,94,.4);}
  .undoask .txt{font-size:12px; margin-bottom:6px;}
  .undoask .row{display:flex; gap:6px;}
  .undoask .btn{margin-top:0; padding:8px 0; font-size:12px;}
  .evallast{margin-top:6px; font-size:12px; font-weight:700; min-height:16px;}
  .q-best{color:#7fd88f;} .q-good{color:#9fd3a6;} .q-inac{color:#f0c14b;}
  .q-mist{color:#f09145;} .q-blun{color:#ff6b6b;}
  .moves .q{font-weight:700;}
  .lobby input{width:100%; padding:10px 12px; margin-bottom:2px; font-size:14px;
    border-radius:8px; border:1px solid #4a505c; background:#1c1f26; color:var(--text);}
  .lobby .lbl{display:block; text-align:left; font-size:11px; letter-spacing:.06em;
    text-transform:uppercase; opacity:.5; margin:12px 0 5px;}
  .seatrow{display:flex; gap:8px;}
  .seat{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:10px 6px; border-radius:8px; border:1px solid #4a505c; cursor:pointer;
    background:#1c1f26; color:var(--text); font-size:13px; font-weight:600;}
  .seat .chip{width:20px; height:20px; border-radius:50%; border:1px solid #6b7280;}
  .seat .chip.cw{background:#fbf8f1;} .seat .chip.cb{background:#26262b;}
  .seat .who{font-size:11px; font-weight:400; opacity:.6; min-height:14px;}
  .seat.on{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent);}
  .seat:disabled{opacity:.45; cursor:not-allowed;}
  .tcrow{display:flex; gap:8px; margin-bottom:14px;}
  .tc{flex:1; padding:10px 4px; border-radius:8px; border:1px solid #4a505c;
    cursor:pointer; background:#1c1f26; color:var(--text); font-size:13px;
    font-weight:600; white-space:nowrap;}
  .tc.on{background:var(--accent); color:#0e1a09; border-color:var(--accent);}
  .lobby{position:fixed; inset:0; background:rgba(16,18,23,.88); display:none;
    align-items:center; justify-content:center; z-index:10;}
  .lobby.on{display:flex;}
  .lobby .card{background:var(--panel); border-radius:14px; padding:28px 32px;
    width:320px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.6);}
  .lobby h2{margin:0 0 6px; font-size:24px;}
  .lobby p{margin:0 0 18px; opacity:.65; font-size:13px;}
  .lobby .btn:disabled{opacity:.4; cursor:not-allowed;}
  .lobby .msg{min-height:18px; margin-top:12px; font-size:12px; color:var(--sel);}
  .btn.link{background:none; color:var(--text); opacity:.5; font-weight:400;
    font-size:12px; padding:6px;}
  .histbox{margin-top:8px; text-align:left; max-height:210px; overflow:auto;}
  .histleer{font-size:12px; opacity:.4; padding:6px 2px;}
  .syncwarn{margin-top:8px; font-size:11px; line-height:1.4; color:var(--check);
    background:#2f1f1f; border-radius:6px; padding:7px 8px;}
  .histwarn{font-size:11px; line-height:1.4; color:var(--sel); background:#2f2a1c;
    border-radius:6px; padding:7px 8px; margin-bottom:8px;}
  .histtabs{display:flex; gap:6px; margin-top:16px;}
  .httab{flex:1; padding:7px 0; border-radius:7px; border:1px solid #4a505c;
    background:#1c1f26; color:var(--text); font-size:12px; cursor:pointer;}
  .httab.on{background:#3a3f4a; border-color:#6b7280;}
  .histrow.rank{grid-template-columns:18px 1fr auto;}
  .histrow.rank .hpos{opacity:.4; font-family:Consolas,monospace;}
  .histrow.rank .hmeta{grid-column:2/4;}
  .histrow.prov{opacity:.6;}
  .histttl{font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    opacity:.5; margin-bottom:6px;}
  .histrow{display:grid; grid-template-columns:1fr auto; gap:1px 10px;
    padding:5px 7px; border-radius:6px; font-size:12px; margin-bottom:2px;}
  .histrow:nth-child(even){background:#1c1f26;}
  .histrow .hn{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-weight:600;}
  .histrow .hr{font-family:Consolas,monospace; font-weight:700; text-align:right;}
  .histrow .hr.d{opacity:.6; font-weight:400;}
  .histrow .hmeta{grid-column:1/3; opacity:.45; font-size:11px;}
  .recap{z-index:11;}                 /* Auswertung liegt über der Lobby */
  .recap .card{width:420px;}
  .recapchart{background:#1c1f26; border-radius:8px; padding:6px; margin-bottom:14px;}
  .recapchart svg{display:block; width:100%; height:70px;}
  .recaptable{width:100%; font-size:13px; margin-bottom:16px;}
  .recaptable .rrow{display:grid; grid-template-columns:1fr 62px 62px;
    gap:6px; padding:5px 8px; align-items:center;}
  .recaptable .rrow.head{font-size:11px; letter-spacing:.05em; text-transform:uppercase;
    opacity:.5;}
  .recaptable .rrow.acc{background:#1c1f26; border-radius:8px; margin-bottom:6px;
    font-weight:700; font-size:15px;}
  .recaptable .rname{display:flex; align-items:center; gap:7px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; font-weight:600;}
  .recaptable .num{text-align:center; font-family:Consolas,monospace;}
  .recaptable .lab{text-align:left; opacity:.75;}
  .recaptable .rrow.est{font-size:12px; opacity:.7;}
  .recaptable .rrow.key{font-size:12px; grid-template-columns:1fr 60px;}
  .q-book{color:#c9a86a;} .q-brill{color:#26c2a3;} .q-great{color:#5b9ad5;}
  .q-miss{color:#e07a5f;}
  .review .rvbar{height:10px; border-radius:5px; background:#141414; overflow:hidden;
    box-shadow:inset 0 0 0 1px #4a505c;}
  .review .rvbar .fill{height:100%; background:#fbf8f1; transition:width .2s;}
  .review .rvhead{display:flex; justify-content:space-between; margin-top:6px;
    font-family:Consolas,monospace; font-size:15px; font-weight:700;}
  .review .rvhead #rvCount{font-size:12px; font-weight:400; opacity:.5;}
  .review .rvmove{margin-top:8px; font-size:13px; font-weight:700; min-height:18px;}
  .review .rvbest{font-size:12px; opacity:.7; min-height:16px; font-family:Consolas,monospace;}
  .review .rvnav{display:flex; gap:6px; margin-top:10px;}
  .review .rvnav .btn{margin-top:0; padding:9px 0; font-size:13px;}
</style>
</head>

<script>
"use strict";
/* ---------- Schach-Engine (vollständige Regeln, keine externen Libs) ---------- */
/* Klassische Staunton-Figuren aus dem eingebetteten SVG-Sprite (siehe
   Lizenzhinweis oben). Jede Figur wird per <use> referenziert. */
function pieceSVG(type,col){
  const id='#'+col+type.toLowerCase();
  return '<svg viewBox="0 0 40 40" aria-hidden="true">'+
         '<use href="'+id+'" xlink:href="'+id+'"/></svg>';
}
// Figur als fertiges Element (Brett, Umwandlung, geschlagene Figuren)
function pieceEl(type,col,cls){
  const el=document.createElement('span');
  el.className=(cls||'piece')+' '+(col==='w'?'white':'black');
  el.innerHTML=pieceSVG(type,col);
  return el;
}

function initBoard(){
  const b=Array.from({length:8},()=>Array(8).fill(null));
  const back=['R','N','B','Q','K','B','N','R'];
  for(let c=0;c<8;c++){
    b[0][c]='b'+back[c]; b[1][c]='bP';
    b[6][c]='wP';        b[7][c]='w'+back[c];
  }
  return b;
}

let state, history, selected, legalCache, flipped=false;
let localOver=false;          // Hotseat: Partie beendet (ohne Steuerung)
// Eigene Farbe im PLC-Betrieb: 'w', 'b', 'v' (Zuschauer) oder null (beide Farben)
let mySide=null;

function newGame(){
  state={
    board:initBoard(), turn:'w',
    castle:{wK:true,wQ:true,bK:true,bQ:true},
    ep:null,                 // en-passant Zielfeld [r,c] oder null
    halfmove:0, fullmove:1
  };
  history=[]; selected=null; legalCache=null;
  localOver=false; recapData=null; quality=[]; reviewIdx=null;
  hideRecap(); renderReview();
  if(Sync.transport){                    // im PLC-Betrieb zurück in die Aufstellung
    phase='setup'; result='';
    const b=tcParts().base; clock={w:b,b:b}; clockAt=Date.now();
  }
  render();
  Sync.publish();
  if(typeof renderPlayers==='function') renderPlayers();
  if(typeof syncLobby==='function') syncLobby();   // zurück in die Vorbereitung
}

const inside=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const colorOf=p=>p?p[0]:null;
const typeOf =p=>p?p[1]:null;

// Pseudo-legale Züge einer Figur (ohne Schach-Prüfung)
function pieceMoves(bd,r,c,st){
  const p=bd[r][c]; if(!p) return [];
  const col=p[0], t=p[1], dir=col==='w'?-1:1, out=[];
  const add=(rr,cc,flag)=>{ if(inside(rr,cc)) out.push({r:rr,c:cc,flag}); };

  if(t==='P'){
    // vorwärts
    if(inside(r+dir,c)&&!bd[r+dir][c]){
      add(r+dir,c);
      const start=col==='w'?6:1;
      if(r===start&&!bd[r+2*dir][c]) add(r+2*dir,c,'double');
    }
    // schlagen + en passant
    for(const dc of [-1,1]){
      const rr=r+dir,cc=c+dc;
      if(!inside(rr,cc)) continue;
      if(bd[rr][cc]&&bd[rr][cc][0]!==col) add(rr,cc,'capture');
      else if(st.ep&&st.ep[0]===rr&&st.ep[1]===cc) add(rr,cc,'ep');
    }
    return out;
  }
  if(t==='N'){
    for(const[dr,dc]of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]){
      const rr=r+dr,cc=c+dc;
      if(inside(rr,cc)&&(!bd[rr][cc]||bd[rr][cc][0]!==col)) add(rr,cc);
    }
    return out;
  }
  if(t==='K'){
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      if(!dr&&!dc)continue;
      const rr=r+dr,cc=c+dc;
      if(inside(rr,cc)&&(!bd[rr][cc]||bd[rr][cc][0]!==col)) add(rr,cc);
    }
    // Rochade wird in legalMoves() ergänzt (braucht Schach-Prüfung)
    return out;
  }
  // Gleiter: B,R,Q
  const dirs=[];
  if(t==='B'||t==='Q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
  if(t==='R'||t==='Q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
  for(const[dr,dc]of dirs){
    let rr=r+dr,cc=c+dc;
    while(inside(rr,cc)){
      if(!bd[rr][cc]){ add(rr,cc); }
      else{ if(bd[rr][cc][0]!==col) add(rr,cc,'capture'); break; }
      rr+=dr; cc+=dc;
    }
  }
  return out;
}

function findKing(bd,col){
  for(let r=0;r<8;r++)for(let c=0;c<8;c++) if(bd[r][c]===col+'K') return [r,c];
  return null;
}
function attacked(bd,r,c,byCol,st){
  for(let rr=0;rr<8;rr++)for(let cc=0;cc<8;cc++){
    const p=bd[rr][cc];
    if(p&&p[0]===byCol){
      // Für Angriffsprüfung: Bauern schlagen nur diagonal -> pieceMoves liefert
      // Schlagfelder korrekt (leere Diagonale wird nicht als Angriff gezählt,
      // aber ein König darf dort auch nicht hin -> wir prüfen Zielfeld separat).
      for(const m of pieceMoves(bd,rr,cc,st)){
        if(p[1]==='P'){ if(m.c!==cc && m.r===r && m.c===c) return true; }
        else if(m.r===r&&m.c===c) return true;
      }
    }
  }
  return false;
}
function inCheck(bd,col,st){
  const k=findKing(bd,col); if(!k) return false;
  return attacked(bd,k[0],k[1],col==='w'?'b':'w',st);
}

// wendet einen Zug auf eine Kopie an, gibt neuen Brett-/State zurück
function applyMove(st,from,to){
  const bd=st.board.map(row=>row.slice());
  const p=bd[from.r][from.c], col=p[0], t=p[1];
  const ns={board:bd, turn:col==='w'?'b':'w',
            castle:{...st.castle}, ep:null,
            halfmove:st.halfmove+1, fullmove:st.fullmove+(col==='b'?1:0)};
  let captured=bd[to.r][to.c];

  // en passant Schlag
  if(t==='P'&&to.flag==='ep'){ captured=bd[from.r][to.c]; bd[from.r][to.c]=null; }
  // Zug ausführen
  bd[to.r][to.c]=p; bd[from.r][from.c]=null;
  // Doppelschritt -> ep-Feld setzen
  if(t==='P'&&to.flag==='double') ns.ep=[(from.r+to.r)/2,from.c];
  // Umwandlung
  if(t==='P'&&(to.r===0||to.r===7)) bd[to.r][to.c]=col+(to.promo||'Q');
  // Rochade: Turm mitziehen
  if(t==='K'&&Math.abs(to.c-from.c)===2){
    const row=from.r;
    if(to.c===6){ bd[row][5]=bd[row][7]; bd[row][7]=null; }   // kurz
    else        { bd[row][3]=bd[row][0]; bd[row][0]=null; }   // lang
  }
  // Rochaderechte aktualisieren
  if(t==='K'){ ns.castle[col+'K']=false; ns.castle[col+'Q']=false; }
  if(t==='R'){
    if(from.c===0) ns.castle[col+'Q']=false;
    if(from.c===7) ns.castle[col+'K']=false;
  }
  // geschlagener Turm auf Ausgangsfeld -> Recht des Gegners löschen
  const oc=col==='w'?'b':'w';
  if(to.r===(oc==='w'?7:0)){
    if(to.c===0) ns.castle[oc+'Q']=false;
    if(to.c===7) ns.castle[oc+'K']=false;
  }
  if(t==='P'||captured) ns.halfmove=0;
  return {ns,captured};
}

// alle legalen Züge einer Farbe (mit Schach-Prüfung + Rochade)
function legalMoves(st,col){
  const res=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=st.board[r][c];
    if(!p||p[0]!==col) continue;
    for(const m of pieceMoves(st.board,r,c,st)){
      const from={r,c}, to={r:m.r,c:m.c,flag:m.flag};
      const {ns}=applyMove(st,from,to);
      if(!inCheck(ns.board,col,ns)) res.push({from,to});
    }
  }
  // Rochade
  const row=col==='w'?7:0;
  if(st.board[row][4]===col+'K' && !inCheck(st.board,col,st)){
    const enemy=col==='w'?'b':'w';
    // kurz
    if(st.castle[col+'K'] && !st.board[row][5] && !st.board[row][6] &&
       st.board[row][7]===col+'R' &&
       !attacked(st.board,row,5,enemy,st) && !attacked(st.board,row,6,enemy,st)){
      res.push({from:{r:row,c:4},to:{r:row,c:6,flag:'castle'}});
    }
    // lang
    if(st.castle[col+'Q'] && !st.board[row][1] && !st.board[row][2] && !st.board[row][3] &&
       st.board[row][0]===col+'R' &&
       !attacked(st.board,row,3,enemy,st) && !attacked(st.board,row,2,enemy,st)){
      res.push({from:{r:row,c:4},to:{r:row,c:2,flag:'castle'}});
    }
  }
  return res;
}

/* ---------- Notation ---------- */
const FILES='abcdefgh';
function sqName(r,c){ return FILES[c]+(8-r); }
function moveSAN(st,mv,promo){
  const p=st.board[mv.from.r][mv.from.c], t=p[1];
  if(mv.to.flag==='castle') return mv.to.c===6?'O-O':'O-O-O';
  const capture = st.board[mv.to.r][mv.to.c] || mv.to.flag==='ep';
  let s='';
  if(t==='P'){ if(capture) s+=FILES[mv.from.c]+'x'; s+=sqName(mv.to.r,mv.to.c);
               if(mv.to.r===0||mv.to.r===7) s+='='+(promo||'Q'); }
  else{ s+=t; if(capture) s+='x'; s+=sqName(mv.to.r,mv.to.c); }
  return s;
}

/* ---------- Rendering & Interaktion ---------- */
const boardEl=document.getElementById('board');
const statusEl=document.getElementById('status');
const turnDot=document.getElementById('turnDot');
const movesEl=document.getElementById('moves');
const promoEl=document.getElementById('promo');
const promoCard=document.getElementById('promoCard');

function currentLegal(){ if(!legalCache) legalCache=legalMoves(state,state.turn); return legalCache; }

function render(){
  boardEl.innerHTML='';
  // Im Durchgeh-Modus zeigt das Brett die Stellung des gewählten Zuges
  const rev=(reviewIdx!==null&&recapData);
  const view=rev?recapData.states[reviewIdx]:state;
  const last=rev ? (reviewIdx>0?history[reviewIdx-1].mv:null)
                 : (history.length?history[history.length-1].mv:null);
  const checkNow=inCheck(view.board,view.turn,view);
  const kingPos=checkNow?findKing(view.board,view.turn):null;
  const sel=rev?null:selected;
  const targets = sel ? currentLegal().filter(m=>m.from.r===sel.r&&m.from.c===sel.c) : [];

  for(let vr=0;vr<8;vr++)for(let vc=0;vc<8;vc++){
    const r=flipped?7-vr:vr, c=flipped?7-vc:vc;
    const sq=document.createElement('div');
    sq.className='sq '+((r+c)%2===0?'light':'dark');
    sq.dataset.r=r; sq.dataset.c=c;
    const p=view.board[r][c];
    if(p) sq.appendChild(pieceEl(p[1],p[0]));
    if(sel&&sel.r===r&&sel.c===c) sq.classList.add('sel');
    if(last&&((last.from.r===r&&last.from.c===c)||(last.to.r===r&&last.to.c===c)))
      sq.classList.add('lastmove');
    if(kingPos&&kingPos[0]===r&&kingPos[1]===c) sq.classList.add('check');
    const tgt=targets.find(m=>m.to.r===r&&m.to.c===c);
    if(tgt){ const d=document.createElement('div'); d.className='dot'; sq.appendChild(d);
             if(view.board[r][c]||tgt.to.flag==='ep') sq.classList.add('capture'); }
    // Koordinaten am Rand
    if(vc===0){ const cr=document.createElement('div'); cr.className='coord rank';
                cr.textContent=8-r; sq.appendChild(cr); }
    if(vr===7){ const cf=document.createElement('div'); cf.className='coord file';
                cf.textContent=FILES[c]; sq.appendChild(cf); }
    sq.addEventListener('click',()=>onSquare(r,c));
    boardEl.appendChild(sq);
  }
  // Status
  const legal=currentLegal();
  const side=state.turn==='w'?'Weiß':'Schwarz';
  turnDot.style.background=state.turn==='w'?'#f2efe7':'#111';
  if(Sync.transport && phase==='over' && result){
    statusEl.textContent=result;
  } else if(Sync.transport && phase==='setup'){
    statusEl.textContent = (seats.w&&seats.b) ? 'Bereit – Spiel starten'
                                              : 'Warte auf Mitspieler …';
  } else if(legal.length===0){
    statusEl.textContent = checkNow
      ? 'Schachmatt - '+(state.turn==='w'?'Schwarz':'Weiß')+' gewinnt!'
      : 'Patt – Remis.';
  } else if(mySide==='v'){
    statusEl.textContent = side+' am Zug'+(checkNow?' – Schach!':'');
  } else if(mySide){
    statusEl.textContent = (mySide===state.turn ? 'Du bist am Zug' : 'Gegner am Zug')
                           +(checkNow?' – Schach!':'');
  } else {
    statusEl.textContent = side+' am Zug'+(checkNow?' – Schach!':'');
  }
  boardEl.style.opacity = (mySide && mySide!==state.turn && legal.length) ? '.85' : '1';
  renderMoves();
  renderHint();             // Empfehlung des Zuschauers wieder anzeigen
  renderUndo();             // offene Rücknahme-Bitte
  renderPlayers();          // Namen, Uhren und geschlagene Figuren aktualisieren
  updateEval();             // Zuschauer: Bewertung zur neuen Stellung
}

// Ein Zug in der Liste, ggf. mit Einstufungs-Symbol der Analyse
function moveSpan(i){
  const el=document.createElement('span');
  el.textContent=history[i].san;
  const q=quality[i];
  if(q&&q.s){ const s=document.createElement('span');
              s.className='q '+q.c; s.textContent=q.s; el.appendChild(s); }
  return el;
}
function renderMoves(){
  movesEl.innerHTML='';
  for(let i=0;i<history.length;i+=2){
    const row=document.createElement('div');
    const n=document.createElement('span'); n.className='n'; n.textContent=(i/2+1)+'.';
    row.appendChild(n); row.appendChild(moveSpan(i));
    if(history[i+1]) row.appendChild(moveSpan(i+1));
    movesEl.appendChild(row);
  }
  movesEl.scrollTop=movesEl.scrollHeight;
}

function onSquare(r,c){
  if(reviewIdx!==null) return;            // Durchgeh-Modus: nur ansehen
  if(currentLegal().length===0) return;   // Partie beendet
  if(mySide && mySide!==state.turn) return;   // fremde Farbe / Zuschauer
  if(Sync.transport && phase!=='run') return; // Partie noch nicht gestartet / beendet
  const p=state.board[r][c];
  if(selected){
    const mv=currentLegal().find(m=>m.from.r===selected.r&&m.from.c===selected.c
                                   &&m.to.r===r&&m.to.c===c);
    if(mv){ doMove(mv); return; }
  }
  if(p&&p[0]===state.turn){ selected={r,c}; render(); }
  else { selected=null; render(); }
}

function doMove(mv){
  const p=state.board[mv.from.r][mv.from.c];
  // Umwandlung -> Auswahl
  if(p[1]==='P'&&(mv.to.r===0||mv.to.r===7)){
    askPromotion(state.turn,(choice)=>finishMove(mv,choice));
    return;
  }
  finishMove(mv,null);
}
function finishMove(mv,promo){
  const to={...mv.to}; if(promo) to.promo=promo;
  const san=moveSAN(state,{from:mv.from,to},promo);
  const {ns}=applyMove(state,mv.from,to);
  history.push({mv:{from:mv.from,to:{r:to.r,c:to.c}},san});
  state=ns; selected=null; legalCache=null;
  // Schach/Matt-Suffix
  const chk=inCheck(state.board,state.turn,state);
  const noMoves=legalMoves(state,state.turn).length===0;
  const h=history[history.length-1];
  if(noMoves&&chk) h.san+='#'; else if(chk) h.san+='+';
  if(!Sync.suppress){
    undoReq='';                                   // ein Zug beendet jede Anfrage
    const mover=(state.turn==='w')?'b':'w';        // wer gerade gezogen hat
    chargeClock(mover);
    if(noMoves){                                   // Matt oder Patt beendet die Partie
      const who=names[mover]||(mover==='w'?'Weiß':'Schwarz');
      finishGame(chk ? 'Schachmatt - '+who+' gewinnt' : 'Patt - Remis',
                 chk ? mover : 'd');
      if(!Sync.transport) localOver=true;
    }
    render(); Sync.publish();
    // Auch wer selbst mattsetzt, bekommt die Auswertung - die Gegenseite
    // bekam sie bisher allein ueber den empfangenen Zustand.
    if(noMoves) runRecap();
  }
}

function askPromotion(col,cb){
  promoCard.innerHTML='';
  for(const t of ['Q','R','B','N']){
    const el=document.createElement('div'); el.className='p';
    el.appendChild(pieceEl(t,col,'promopiece'));
    el.addEventListener('click',()=>{ promoEl.classList.remove('on'); cb(t); });
    promoCard.appendChild(el);
  }
  promoEl.classList.add('on');
}

// Die letzten n Halbzüge zurücknehmen (Zustand einfach neu aufbauen)
function undoPlies(n){
  if(!history.length) return;
  const saved=history.slice(0,Math.max(0,history.length-n));
  newGameSilent();
  history=[];
  Sync.suppress=true;
  for(const h of saved){
    const legal=legalMoves(state,state.turn);
    const mv=legal.find(m=>m.from.r===h.mv.from.r&&m.from.c===h.mv.from.c
                          &&m.to.r===h.mv.to.r&&m.to.c===h.mv.to.c);
    const promo=/=([QRBN])/.exec(h.san);
    finishMove(mv,promo?promo[1]:null);
  }
  Sync.suppress=false;
  selected=null; legalCache=null;
}
/* Im Netzbetrieb ist die Rücknahme eine Bitte an den Gegner; im Hotseat
   sitzen beide vor demselben Brett und nehmen den Zug direkt zurück. */
function undo(){
  if(!history.length) return;
  if(Sync.transport){
    if(mySide!=='w'&&mySide!=='b') return;        // Zuschauer fragen nicht
    if(phase!=='run'||undoReq) return;
    undoReq=mySide; Sync.publish(); render(); renderUndo();
    return;
  }
  undoPlies(1); render(); Sync.publish();
}
function undoAccept(){
  if(!undoReq||undoReq===mySide) return;
  // So weit zurück, dass der Bittende wieder am Zug ist
  undoPlies(state.turn===undoReq?2:1);
  undoReq=''; render(); Sync.publish(); renderUndo();
}
function undoDecline(){
  if(!undoReq||undoReq===mySide) return;
  undoReq=''; Sync.publish(); render(); renderUndo();
}
// Anzeige der offenen Rücknahme-Bitte
/* Bei anhaltenden Zugriffsfehlern sagen, was los ist, statt still zu
   verharren - der Spielstand liegt dann nur noch lokal vor. */
function renderWarn(){
  const el=document.getElementById('syncWarn');
  if(!el) return;
  const bad=Sync.fails>=3;
  el.style.display=bad?'block':'none';
  if(bad) el.textContent='Steuerung antwortet nicht ('+Sync.fails+' Versuche). '+
    'Die Partie läuft lokal weiter, wird aber gerade nicht übertragen.';
}
function renderUndo(){
  const box=document.getElementById('undoAsk');
  const btn=document.getElementById('undoBtn');
  if(!box) return;
  const seated=(mySide==='w'||mySide==='b');
  const asked=!!undoReq&&!!Sync.transport;
  box.style.display=(asked&&seated&&undoReq!==mySide)?'block':'none';
  if(asked&&seated&&undoReq!==mySide){
    document.getElementById('undoTxt').textContent=
      (names[undoReq]||(undoReq==='w'?'Weiß':'Schwarz'))+' bittet um Rücknahme des Zuges.';
  }
  if(btn&&Sync.transport){
    const mine=(asked&&undoReq===mySide);
    btn.disabled=mine||!seated||phase!=='run'||!history.length;
    btn.textContent=mine?'Rücknahme angefragt …':'Zug zurück';
  }
}
function newGameSilent(){
  state={board:initBoard(),turn:'w',
    castle:{wK:true,wQ:true,bK:true,bQ:true},ep:null,halfmove:0,fullmove:1};
  history=[]; selected=null; legalCache=null;
}

/* ---------- Synchronisation (zwei Clients, ein Brett) ----------
   Der komplette Spielverlauf wird als Zugliste serialisiert (z.B.
   "e2e4 e7e5 g1f3"). Beide Seiten bauen daraus dasselbe Brett auf.
   Sync.transport wird vom Host gesetzt:
     - im mapp-View-Custom-Widget: Bindung an eine PLC-STRING-Variable
     - im lokalen Demo (?demo in der URL): BroadcastChannel zwischen Tabs */
function parseSq(s){ return {c:FILES.indexOf(s[0]), r:8-parseInt(s[1],10)}; }
function serializeGame(){
  return history.map(h=>{
    const f=sqName(h.mv.from.r,h.mv.from.c), t=sqName(h.mv.to.r,h.mv.to.c);
    const pr=/=([QRBN])/.exec(h.san);
    return f+t+(pr?pr[1].toLowerCase():'');
  }).join(' ');
}
function loadGame(str){
  newGameSilent();
  const codes=(str||'').trim() ? str.trim().split(/\s+/) : [];
  Sync.suppress=true;
  for(const code of codes){
    const from=parseSq(code.slice(0,2)), to=parseSq(code.slice(2,4));
    const promo=code.length>4?code[4].toUpperCase():null;
    const mv=legalMoves(state,state.turn).find(m=>
      m.from.r===from.r&&m.from.c===from.c&&m.to.r===to.r&&m.to.c===to.c);
    if(!mv) break;                 // ungültiger Code -> Rest ignorieren
    finishMove(mv,promo);
  }
  Sync.suppress=false;
  selected=null; legalCache=null;
}
/* Gemeinsamer Zustand in EINER SPS-Variable:
   "w=id:Name;b=id:Name;v=id:Name,id:Name;tc=180+2;tw=180000;tb=180000;st=run|e2e4 e7e5"
   Kopf = Plätze, Namen, Zuschauer, Zeitmodus und Restzeiten; danach die Zugliste. */
const seats={w:'',b:''};                   // Platz-Kennungen
const names={w:'',b:''};                   // Spielernamen
let specs=[];                              // Zuschauer [{id,name}]
let tc='180+2';                            // Zeitmodus "Sekunden+Inkrement"
let clock={w:0,b:0};                       // Restzeiten in ms
let phase='setup';                         // setup | run | over
let undoReq='';                            // 'w'/'b': dieser Spieler bittet um Rücknahme
let hist=[];                               // vergangene Partien, neueste zuerst
const HIST_MAX=40;                         // eigene Variable, daher grosszuegig
let result='';                             // Ergebnistext bei phase==='over'

const MAXSPECS=8;                          // Begrenzung, damit der String klein bleibt
function clean(s){ return String(s||'').replace(/[;:,|=<>&"'~!]/g,'').trim().slice(0,12); }
// Ergebnistext: länger erlaubt als ein Name, aber ohne Auszeichnung
function clean0(s){ return String(s||'').replace(/[;|<>&"']/g,'').trim().slice(0,60); }
// Für Text, der in Markup eingesetzt wird (Auswertung baut ihre Tabelle so auf)
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function tcParts(){ const p=tc.split('+'); return {base:(+p[0]||180)*1000, inc:(+p[1]||0)*1000}; }

function serializeState(){
  const ent=(id,nm)=>id?(id+':'+nm):'';
  const f=['w='+ent(seats.w,names.w), 'b='+ent(seats.b,names.b),
           'v='+specs.slice(0,MAXSPECS).map(s=>s.id+':'+s.name).join(','),
           'tc='+tc, 'tw='+Math.max(0,Math.round(clock.w)),
           'tb='+Math.max(0,Math.round(clock.b)), 'st='+phase];
  if(result) f.push('res='+result.replace(/[;|]/g,''));
  if(undoReq) f.push('ur='+undoReq);
  return f.join(';')+'|'+serializeGame();
}
function parseState(str){
  const s=String(str||''), i=s.indexOf('|');
  const out={w:'',b:'',nw:'',nb:'',specs:[],tc:'180+2',tw:0,tb:0,st:'setup',res:'',ur:'',
             moves:i<0?s.trim():s.slice(i+1).trim()};
  if(i<0) return out;                              // ganz altes Format: nur Züge
  const head=s.slice(0,i);
  if(head.indexOf('=')<0){                         // Vorversion: "<id-w>,<id-b>"
    const p=head.split(','); out.w=(p[0]||'').trim(); out.b=(p[1]||'').trim(); return out;
  }
  for(const part of head.split(';')){
    const k=part.slice(0,part.indexOf('=')), v=part.slice(part.indexOf('=')+1);
    if(k==='w'||k==='b'){ const c=v.split(':');
      out[k]=clean(c[0]); out['n'+k]=clean(c[1]); }
    else if(k==='v'){ out.specs=v?v.split(',').filter(Boolean).map(e=>{
      const c=e.split(':'); return {id:clean(c[0]), name:clean(c[1])}; }):[]; }
    else if(k==='tc') out.tc=v||'180+2';
    else if(k==='tw') out.tw=+v||0;
    else if(k==='tb') out.tb=+v||0;
    else if(k==='st') out.st=v||'setup';
    else if(k==='res') out.res=clean0(v);
    else if(k==='ur') out.ur=v||'';
  }
  return out;
}
const Sync={
  transport:null, suppress:false, last:null, fails:0,
  ready:true,                    // erst nach dem ersten Abgleich darf publiziert werden
  publish(){ if(!this.transport||this.suppress) return;
             const s=serializeState();
             // Transporte mit Bestätigung setzen 'last' erst nach dem Schreiben -
             // sonst gilt ein fehlgeschlagener Zug als übertragen und die nächste
             // Abfrage macht ihn mit dem alten Stand wieder rückgängig.
             if(!this.transport.confirms) this.last=s;
             this.transport.send(s); },
  receive(str){
    if(str===this.last) return;                   // eigener Echo -> ignorieren
    this.last=str;
    applyState(parseState(str));
  }
};
/* Nicht jede Antwort ist ein Spielstand: Der Webserver der Steuerung
   schickt bei einem Fehler eine HTML-Seite, und ein abgebrochener Zugriff
   liefert gar nichts. Solche Antworten dürfen die laufende Partie nicht
   ersetzen - sonst wirken die Plätze plötzlich unbesetzt und der Client
   wirft sich selbst zurück in die Lobby. */
function acceptState(txt){
  if(typeof txt!=='string') return false;
  if(txt.indexOf('<')>=0) return false;                 // Fehlerseite
  if(!txt.trim()) return !(phase==='run'&&history.length); // leer nur ausserhalb der Partie
  return txt.indexOf('|')>=0 || txt.indexOf('=')>=0;    // sieht nach unserem Format aus
}
// Übernimmt einen empfangenen Zustand vollständig
function applyState(st){
  const wasOver=(phase==='over');
  seats.w=st.w; seats.b=st.b; names.w=st.nw; names.b=st.nb;
  specs=st.specs; tc=st.tc; phase=st.st; result=st.res; undoReq=st.ur;
  clock.w=st.tw; clock.b=st.tb; clockAt=Date.now();   // Basis fürs lokale Ticken
  if(st.moves!==serializeGame()) loadGame(st.moves);
  /* Platz nur aufgeben, wenn dort tatsächlich jemand anderes sitzt. Ist er
     bloß leer, hat der andere Client mit veralteter Sicht veröffentlicht -
     dann tragen wir uns einfach wieder ein, statt die Partie zu verlassen. */
  for(const col of ['w','b']){
    if(mySide!==col) continue;
    if(seats[col]===myId) break;
    if(seats[col]){ leaveSeat(true); break; }             // fremd besetzt
    seats[col]=myId; names[col]=myName()||names[col];     // Platz zurückholen
    Sync.publish();
  }
  render(); renderLobby(); syncLobby();   // Startet der Gegner, schließt die Lobby
  if(!wasOver && phase==='over'){ runRecap(); refreshHist(true); }
}
window.ChessSync=Sync;             // Zugriffspunkt für externe Transports

/* ---------- Schachuhr ----------
   Nur die Seite am Zug verbraucht Zeit. Jeder Client zählt lokal ab dem
   Moment herunter, in dem er den Zustand empfangen hat (clockAt) – dadurch
   ist keine Uhrzeit-Synchronisation zwischen den PCs nötig. Verbindlich
   rechnet der Spieler ab, der zieht: er schreibt seine neue Restzeit mit. */
let clockAt=Date.now();
function liveClock(col){
  if(phase!=='run'||col!==state.turn) return clock[col];
  return clock[col]-(Date.now()-clockAt);
}
function fmtClock(ms){
  if(ms<0) ms=0;
  const t=Math.ceil(ms/1000), m=Math.floor(t/60), s=t%60;
  return m+':'+(s<10?'0':'')+s;
}
function chargeClock(col){                  // Zeit des ziehenden Spielers abrechnen
  if(phase!=='run') return;
  const now=Date.now();
  clock[col]=Math.max(0,clock[col]-(now-clockAt))+tcParts().inc;
  clockAt=now;
}
function startGame(){
  const b=tcParts().base;
  clock={w:b,b:b}; clockAt=Date.now(); phase='run'; result='';
  recapData=null; quality=[]; hideRecap();
  newGameSilent(); render(); renderLobby(); Sync.publish(); syncLobby();
}
/* Partieende an einer Stelle bündeln: Nur wer das Ende selbst auslöst,
   schreibt den Eintrag in die Historie – die anderen bekommen ihn über den
   geteilten Zustand und würden ihn sonst doppelt anlegen. */
function finishGame(text,winner){
  phase='over'; result=text;
  pushHistory(winner);
}
function endGame(text,winner){
  finishGame(text,winner);
  render(); renderLobby(); Sync.publish();
  runRecap();
}
// Eintrag: Namen, Ausgang ('w','b','d'), Halbzüge, Zeitstempel (Minuten, base36)
function pushHistory(winner){
  if(!history.length) return;
  const nm=c=>(names[c]||(c==='w'?'Weiß':'Schwarz'));
  hist.unshift({w:nm('w'), b:nm('b'), r:winner||'d', n:history.length,
                t:Math.floor(Date.now()/60000).toString(36)});
  hist=hist.slice(0,HIST_MAX);
  if(Sync.transport) storeHist(); else saveLocalHist();
  renderHist();
}
function saveLocalHist(){
  try{ localStorage.setItem('chessHist',JSON.stringify(hist)); }catch(e){}
}
function loadLocalHist(){
  try{ const v=localStorage.getItem('chessHist');
       if(v) hist=JSON.parse(v).slice(0,HIST_MAX); }catch(e){}
}

/* ---------- Historie in eigener Ablage ----------
   Getrennt vom Spielstand: sie aendert sich nur am Partieende und darf
   deshalb viel mehr Partien fassen. Gelesen wird sie nur, wenn sie
   jemand sieht (Lobby, Auswertung) - nicht im Sekundentakt. */
const Hist={ load:null, save:null, at:0, broken:false };
function histToText(){ return hist.map(e=>[e.w,e.b,e.r,e.n,e.t].join('~')).join('!'); }
function histFromText(v){
  hist=(v||'').split('!').filter(Boolean).map(e=>{
    const c=e.split('~');
    return {w:clean(c[0]),b:clean(c[1]),r:(c[2]||'').slice(0,1),
            n:+c[3]||0,t:(c[4]||'').slice(0,8)};
  }).slice(0,HIST_MAX);
}
async function refreshHist(force){
  if(!Hist.load) return;
  const now=Date.now();
  if(!force && now-Hist.at<5000) return;      // hoechstens alle 5 s nachsehen
  Hist.at=now;
  let v;
  try{ v=await Hist.load(); }
  catch(e){                                   // Ablage nicht erreichbar
    Hist.broken=true;
    if(!hist.length) loadLocalHist();         // wenigstens der eigene Stand
    renderHist(); return;
  }
  if(typeof v!=='string' || v.indexOf('<')>=0) return;   // Fehlerseite statt Daten
  const t=v.trim();
  // Eine leere Ablage darf einen vorhandenen Stand nicht loeschen - sie wird
  // stattdessen nachgeschrieben. Sonst verschwaende ein fehlgeschlagener
  // Schreibvorgang die gerade beendete Partie.
  if(!t){ if(hist.length) storeHist(); return; }
  Hist.broken=false;
  histFromText(t); renderHist();
}
async function storeHist(){
  if(!Hist.save) return;
  Hist.at=Date.now();
  try{ await Hist.save(histToText()); Hist.broken=false; }
  catch(e){ Hist.broken=true; saveLocalHist(); renderHist(); }
}
function tickClocks(){
  if(!Sync.transport) return;
  renderPlayers();
  if(phase!=='run') return;
  const t=state.turn, left=liveClock(t);
  if(left>0) return;
  // Der Spieler am Zug meldet selbst; ist sein PC weg, meldet der Gegner nach 5 s
  const iMove=(mySide===t), iWait=(mySide&&mySide!=='v'&&mySide!==t&&left<=-5000);
  if(iMove||iWait){
    clock[t]=0;
    endGame('Zeit abgelaufen - '+(t==='w'?names.b||'Schwarz':names.w||'Weiß')+' gewinnt',
            t==='w'?'b':'w');
  }
}
setInterval(tickClocks,200);

/* Geschlagene Figuren: was auf dem Brett gegenüber der Grundstellung fehlt */
const VALUE={Q:9,R:5,B:3,N:3,P:1};
function capturedBy(col){
  const enemy=col==='w'?'b':'w';
  const start={Q:1,R:2,B:2,N:2,P:8}, cur={Q:0,R:0,B:0,N:0,P:0};
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=state.board[r][c];
    if(p&&p[0]===enemy&&cur[p[1]]!==undefined) cur[p[1]]++;
  }
  const out=[]; let pts=0;
  for(const t of ['Q','R','B','N','P']){
    const n=Math.max(0,start[t]-cur[t]);
    for(let i=0;i<n;i++) out.push(t);
    pts+=n*VALUE[t];
  }
  return {list:out, pts};
}

function renderPlayers(){
  const el=document.getElementById('players');
  if(!el) return;
  if(reviewIdx!==null){ el.style.display='none'; return; }
  const plc=!!Sync.transport;
  const capW=capturedBy('w'), capB=capturedBy('b');
  el.innerHTML='';
  for(const col of ['w','b']){
    const row=document.createElement('div');
    row.className='pl'+(col===state.turn&&(!plc||phase==='run')?' turn':'');
    const head=document.createElement('div'); head.className='plhead';
    const dot=document.createElement('span'); dot.className='dotc';
    dot.style.background=col==='w'?'#f2efe7':'#111';
    const nm=document.createElement('span'); nm.className='nm';
    nm.textContent = plc ? (names[col]||(seats[col]?'Spieler':'frei'))+(seats[col]===myId?' (du)':'')
                         : (col==='w'?'Weiß':'Schwarz');
    head.appendChild(dot); head.appendChild(nm);
    if(plc){
      const ck=document.createElement('span'); ck.className='clk';
      const ms=liveClock(col); ck.textContent=fmtClock(ms);
      if(phase==='run'&&ms<30000) ck.classList.add('low');
      head.appendChild(ck);
    }
    row.appendChild(head);
    // geschlagene Figuren dieses Spielers + Materialvorsprung
    const cap=(col==='w')?capW:capB, diff=capW.pts-capB.pts;
    const adv=(col==='w')?diff:-diff;
    if(cap.list.length||adv>0){
      const cw=document.createElement('div'); cw.className='cap';
      const enemy=(col==='w')?'b':'w';               // erbeutet wird die Gegnerfarbe
      for(const t of cap.list) cw.appendChild(pieceEl(t,enemy,'cappiece'));
      if(adv>0){ const s=document.createElement('span'); s.className='adv';
                 s.textContent='+'+adv; cw.appendChild(s); }
      row.appendChild(cw);
    }
    el.appendChild(row);
  }
  const rb=document.getElementById('recapBtn');
  const over=plc?(phase==='over'):localOver;
  if(rb) rb.style.display=(over&&history.length)?'block':'none';
  const sp=document.getElementById('specs');
  if(!plc){ sp.textContent=''; return; }
  sp.textContent = specs.length
    ? 'Zuschauer: '+specs.map(s=>s.name||'Gast').join(', ')
    : 'Keine Zuschauer';
  renderTC();
}
function renderTC(){
  for(const btn of document.querySelectorAll('.tc'))
    btn.classList.toggle('on',btn.dataset.tc===tc);
}
function setTC(v){
  if(phase==='run') return;
  tc=v; const b=tcParts().base; clock={w:b,b:b}; clockAt=Date.now();
  renderTC(); renderPlayers(); renderLobby();
  if(mySide==='w'||mySide==='b') Sync.publish();
}

/* ---------- Stellungsbewertung für Zuschauer (Stockfish, lokal) ----------
   Nutzt stockfish-18-lite-single.js/.wasm aus demselben Verzeichnis. Fehlen
   die Dateien, bleibt die Anzeige einfach aus – das Spiel läuft normal. */
const ENGINE_FILE='stockfish-18-lite-single.js';
let sf=null, sfReady=false, sfSeen='', sfOff=false;
// Zugbewertung: Bewertung vor dem Zug gegen die nach dem Zug halten
const RATE_DEPTH=13;                 // ab dieser Tiefe gilt ein Wert als belastbar
let evalCur={moves:null,cp:null};    // laufende Analyse (cp aus Weiß-Sicht)
let evalPrev=null;                   // Bewertung der Vorgängerstellung
let quality=[];                      // Einstufung je Halbzug
function scoreCp(sc){                // Matt in eine Zentibauern-Zahl übersetzen
  return sc.mate!==undefined ? (sc.mate>0?1:-1)*(10000-Math.abs(sc.mate)*10) : sc.cp;
}
/* Eingestuft wird nach dem Verlust an Gewinnwahrscheinlichkeit, nicht nach
   Zentibauern: ein Abfall von +8 auf +3 ändert am Ausgang nichts, während
   derselbe Bauernwert in ausgeglichener Stellung die Partie entscheidet. */
function classify(drop){
  if(drop<2)  return {t:'Bester Zug',  s:'',   c:'q-best'};
  if(drop<10) return {t:'Gut',         s:'',   c:'q-good'};
  if(drop<20) return {t:'Ungenau',     s:'?!', c:'q-inac'};
  if(drop<30) return {t:'Fehler',      s:'?',  c:'q-mist'};
  return            {t:'Grober Fehler',s:'??', c:'q-blun'};
}

function engineOn(){
  if(sf||sfOff) return;
  try{ sf=new Worker(ENGINE_FILE); }catch(e){ sfOff=true; return; }
  sf.onerror=()=>{ sfOff=true; sf=null; document.getElementById('evalBox').style.display='none'; };
  sf.onmessage=(e)=>onEngine(typeof e.data==='string'?e.data:'');
  sf.postMessage('uci');
}
function engineOff(){
  if(sf){ try{ sf.postMessage('stop'); sf.terminate(); }catch(e){} }
  sf=null; sfReady=false; sfSeen='';
}
function onEngine(line){
  if(line==='uciok'){ sfReady=true; if(batch) batch.go(); else analyse(true); return; }
  if(batch){                                   // Stapel-Analyse fürs Recap
    if(line.indexOf('info ')===0 && line.indexOf(' pv ')>=0){
      const m=/score mate (-?\d+)/.exec(line), c=/score cp (-?\d+)/.exec(line);
      if(m||c){
        const mp=/multipv (\d+)/.exec(line), n=mp?+mp[1]:1;
        const v=batch.sign*scoreCp(m?{mate:+m[1]}:{cp:+c[1]});
        const first=line.slice(line.indexOf(' pv ')+4).trim().split(/\s+/)[0];
        if(n===1){ batch.cp=v; batch.best=first; } else if(n===2){ batch.second=v; }
      }
    } else if(line.indexOf('bestmove')===0){
      const r=batch.res, v={cp:batch.cp, best:batch.best, second:batch.second};
      batch=null; r(v);
    }
    return;
  }
  if(line.indexOf('info ')!==0 || line.indexOf(' pv ')<0) return;
  const mate=/score mate (-?\d+)/.exec(line), cp=/score cp (-?\d+)/.exec(line);
  const dep=/ depth (\d+)/.exec(line);
  const pv=line.slice(line.indexOf(' pv ')+4).trim().split(/\s+/);
  // Werte kommen aus Sicht der Seite am Zug -> auf Weiß-Sicht drehen
  const sign=(state.turn==='w')?1:-1;
  const sc=mate?{mate:sign*(+mate[1])}:cp?{cp:sign*(+cp[1])}:null;
  const depth=dep?+dep[1]:0;
  if(sc){ evalCur.cp=scoreCp(sc); if(depth>=RATE_DEPTH) rateLastMove(); }
  showEval(sc,depth,pv);
}
// Den zuletzt gespielten Zug einstufen, sobald die neue Stellung bewertet ist
function rateLastMove(){
  const i=history.length-1;
  if(i<0||!evalPrev||quality[i]) return;
  const mover=(state.turn==='w')?'b':'w';          // wer gerade gezogen hat
  const before=winPct(evalPrev.cp), after=winPct(evalCur.cp);
  const drop=(mover==='w')?(before-after):(after-before);
  quality[i]=classify(Math.max(0,drop));
  quality[i].san=history[i].san;
  renderMoves(); showLastQuality();
}
function showLastQuality(){
  const el=document.getElementById('evalLast');
  if(!el) return;
  const q=quality[history.length-1];
  el.className='evallast'+(q?' '+q.c:'');
  el.textContent=q?('Letzter Zug: '+q.san+' – '+q.t):'';
}
function showEval(sc,depth,pv){
  const box=document.getElementById('evalBox');
  if(!sc||box.style.display==='none') return;
  let txt, frac;
  if(sc.mate!==undefined){
    txt=(sc.mate>0?'+':'-')+'M'+Math.abs(sc.mate); frac=sc.mate>0?1:0;
  }else{
    const p=sc.cp/100;
    txt=(p>0?'+':'')+p.toFixed(2);
    frac=1/(1+Math.pow(10,-sc.cp/400));            // Gewinnwahrscheinlichkeit Weiß
  }
  document.getElementById('evalScore').textContent=txt;
  document.getElementById('evalDepth').textContent='Tiefe '+depth;
  document.getElementById('evalFill').style.width=Math.round(frac*100)+'%';
  document.getElementById('evalPv').textContent=pvSan(pv,6);
  // Empfohlener Zug: im Text und als Markierung auf dem Brett
  const best=pv[0];
  const el=document.getElementById('evalBest');
  if(best&&/^[a-h][1-8][a-h][1-8]/.test(best)){
    el.textContent='Bester Zug: '+pvSan([best],1);
    setHint({from:parseSq(best.slice(0,2)),to:parseSq(best.slice(2,4))});
  }else{ el.textContent=''; setHint(null); }
}
/* Markierung des empfohlenen Zuges – nur die betroffenen Felder anfassen,
   damit die Engine-Meldungen nicht das ganze Brett neu zeichnen. */
let hint=null;
function setHint(h){
  const same=(!h&&!hint)||(h&&hint&&h.from.r===hint.from.r&&h.from.c===hint.from.c
                           &&h.to.r===hint.to.r&&h.to.c===hint.to.c);
  hint=h; if(!same) renderHint();
}
function renderHint(){
  for(const sq of boardEl.querySelectorAll('.sq.hintfrom,.sq.hintto'))
    sq.classList.remove('hintfrom','hintto');
  if(!hint||mySide!=='v'||reviewIdx!==null) return;
  const f=boardEl.querySelector('.sq[data-r="'+hint.from.r+'"][data-c="'+hint.from.c+'"]');
  const t=boardEl.querySelector('.sq[data-r="'+hint.to.r+'"][data-c="'+hint.to.c+'"]');
  if(f) f.classList.add('hintfrom');
  if(t) t.classList.add('hintto');
}
// Hauptvariante in lesbare Notation umsetzen
function pvSan(uci,n){
  let st=state; const out=[];
  for(const code of uci.slice(0,n)){
    if(!/^[a-h][1-8][a-h][1-8]/.test(code)) break;
    const from=parseSq(code.slice(0,2)), to=parseSq(code.slice(2,4));
    const promo=code.length>4?code[4].toUpperCase():null;
    const mv=legalMoves(st,st.turn).find(m=>m.from.r===from.r&&m.from.c===from.c
                                           &&m.to.r===to.r&&m.to.c===to.c);
    if(!mv) break;
    const t={...mv.to}; if(promo) t.promo=promo;
    out.push(moveSAN(st,{from:mv.from,to:t},promo));
    st=applyMove(st,mv.from,t).ns;
  }
  return out.join(' ');
}
function analyse(force){
  if(!sf||!sfReady) return;
  const moves=serializeGame();
  if(!force && moves===sfSeen) return;
  // Ist die neue Stellung genau einen Zug weiter, dient die bisherige
  // Bewertung als Referenz für die Einstufung dieses Zuges.
  const prev=evalCur.moves;
  let oneMore=false;
  if(prev!==null && moves!==prev){
    oneMore = prev==='' ? (moves!==''&&moves.indexOf(' ')<0)
                        : (moves.indexOf(prev+' ')===0 &&
                           moves.slice(prev.length+1).indexOf(' ')<0);
  }
  evalPrev=(oneMore&&evalCur.cp!==null)?{cp:evalCur.cp}:null;
  if(prev!==null && moves!==prev && !oneMore) quality=[];   // neues Spiel / Rücknahme
  evalCur={moves,cp:null};
  sfSeen=moves;
  showLastQuality();
  if(currentLegal().length===0){                   // Partie vorbei -> nichts rechnen
    document.getElementById('evalPv').textContent='';
    document.getElementById('evalDepth').textContent='';
    return;
  }
  sf.postMessage('stop');
  sf.postMessage('position startpos'+(moves?' moves '+moves:''));
  sf.postMessage('go depth 14');
}
function updateEval(){                             // nur Zuschauer sehen die Analyse
  const box=document.getElementById('evalBox');
  if(!box) return;
  const want=(mySide==='v');
  box.style.display=(want&&!sfOff)?'block':'none';
  if(want){ engineOn(); analyse(false); } else if(sf) engineOff();
}

/* ---------- Eröffnungsbuch ----------
   Zugfolgen sind als Quadrat-Indizes (2 Zeichen je Halbzug) kodiert und
   gegenüber dem Vorgänger präfixkomprimiert; dasselbe für die Namen. */
const B64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
const bookNames=new Map(), bookPrefix=new Set();
(function loadBook(){
  const el=document.getElementById('bookData');
  if(!el) return;
  let pm='',pn='';
  for(const line of el.textContent.split('\n')){
    const t=line.indexOf('\t'); if(t<0) continue;
    const mp=line.slice(0,t), np=line.slice(t+1);
    const m=pm.slice(0,B64.indexOf(mp[0]))+mp.slice(1);
    const n=pn.slice(0,B64.indexOf(np[0]))+np.slice(1);
    bookNames.set(m,n); pm=m; pn=n;
    for(let i=2;i<=m.length;i+=2) bookPrefix.add(m.slice(0,i));
  }
})();
function encSq(s){ return B64[(s.charCodeAt(0)-97)+8*(8-(+s[1]))]; }
function encMoves(list){                       // UCI-Liste -> Buch-Kodierung
  let o=''; for(const c of list) o+=encSq(c.slice(0,2))+encSq(c.slice(2,4));
  return o;
}
function bookOpening(moves){                   // längster Treffer als Name
  let best='',code='';
  for(let k=1;k<=moves.length;k++){
    const e=encMoves(moves.slice(0,k));
    if(bookNames.has(e)){ best=bookNames.get(e); code=e; }
    if(!bookPrefix.has(e)) break;
  }
  return {name:best,plies:code.length/2};
}

/* ---------- Game Recap: Partie nach dem Ende komplett auswerten ---------- */
const RECAP_DEPTH=14, DEEP_DEPTH=17, DEEP_MAX=8;
let batch=null, recapRun=false, recapData=null;

// Bewertung einer Stellung nach k Halbzügen (aus Sicht von Weiß),
// dazu bester und zweitbester Zug für die Einstufung
function evalPosition(movesStr,k,depth){
  return new Promise(res=>{
    const send=()=>{ sf.postMessage('setoption name MultiPV value 2');
                     sf.postMessage('position startpos'+(movesStr?' moves '+movesStr:''));
                     sf.postMessage('go depth '+(depth||RECAP_DEPTH)); };
    batch={cp:0, best:null, second:null, sign:(k%2===0)?1:-1, res, go:send};
    if(sfReady) send();
  });
}
/* Materialtausch auf einem Feld: Was gewinnt der Gegner dort? (2 Halbzüge) */
function exchangeGain(st,r,c){
  const target=st.board[r][c]; if(!target) return 0;
  let best=0;
  for(const mv of legalMoves(st,st.turn)){
    if(mv.to.r!==r||mv.to.c!==c) continue;
    const {ns}=applyMove(st,mv.from,mv.to);
    let back=0;
    for(const mv2 of legalMoves(ns,ns.turn)){
      if(mv2.to.r===r&&mv2.to.c===c){
        const v=ns.board[r][c]; back=Math.max(back,VALUE[v[1]]||0);
      }
    }
    best=Math.max(best,(VALUE[target[1]]||0)-back);
  }
  return best;
}
// Stellungen der ganzen Partie nachspielen (für Brett und Opfererkennung)
function replayStates(codes){
  const out=[]; let st={board:initBoard(),turn:'w',
    castle:{wK:true,wQ:true,bK:true,bQ:true},ep:null,halfmove:0,fullmove:1};
  out.push(st);
  for(const code of codes){
    const from=parseSq(code.slice(0,2)), to=parseSq(code.slice(2,4));
    const promo=code.length>4?code[4].toUpperCase():null;
    const mv=legalMoves(st,st.turn).find(m=>m.from.r===from.r&&m.from.c===from.c
                                           &&m.to.r===to.r&&m.to.c===to.c);
    if(!mv) break;
    const t={...mv.to}; if(promo) t.promo=promo;
    st=applyMove(st,mv.from,t).ns; out.push(st);
  }
  return out;
}
function nonPawnMaterial(st){
  let s=0;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=st.board[r][c];
    if(p&&p[1]!=='P'&&p[1]!=='K') s+=VALUE[p[1]]||0;
  }
  return s;
}
// Grobe Spielstärke-Schätzung aus der Genauigkeit – bewusst nur ein Richtwert
function ratingEstimate(acc){
  return Math.max(400,Math.min(2800,Math.round((acc-35)*46)));
}
// Gewinnerwartung und Genauigkeit nach der bei lichess gebräuchlichen Formel
function winPct(cp){ return 50+50*(2/(1+Math.exp(-0.00368208*cp))-1); }
function moveAccuracy(drop){
  return Math.max(0,Math.min(100,103.1668*Math.exp(-0.04354*drop)-3.1669));
}
async function runRecap(){
  if(recapRun||sfOff) return;
  recapRun=true;
  const moves=serializeGame().split(/\s+/).filter(Boolean);
  showRecap({busy:true,done:0,total:moves.length+1});
  engineOn();
  if(!sf){ recapRun=false; showRecap({error:true}); return; }
  const states=replayStates(moves);
  const cps=[],bests=[],seconds=[];
  for(let k=0;k<=moves.length;k++){
    const st=states[k];
    // Matt oder Patt: die Engine liefert keine Variante mehr, der Wert steht fest
    if(st&&legalMoves(st,st.turn).length===0){
      const mated=inCheck(st.board,st.turn,st);
      cps.push(mated?(st.turn==='w'?-10000:10000):0);
      bests.push(null); seconds.push(null);
    }else{
      const r=await evalPosition(moves.slice(0,k).join(' '),k);
      cps.push(r.cp); bests.push(r.best); seconds.push(r.second);
    }
    showRecap({busy:true,done:k+1,total:moves.length+1});
  }
  /* Zweite Runde: Bei scharfen Stellungen kann die Bewertung zwischen zwei
     Suchen springen – die Engine sieht ein Opfer erst eine Stellung später.
     Genau dort rechnen wir tiefer nach, statt die ganze Partie zu verlangsamen. */
  const swings=[];
  for(let i=0;i<moves.length;i++){
    const j=Math.abs(cps[i]-cps[i+1]);
    if(j>=250) swings.push({i,j});
  }
  swings.sort((a,b)=>b.j-a.j);
  const deep=new Set();
  for(const s of swings.slice(0,DEEP_MAX)){ deep.add(s.i); deep.add(s.i+1); }
  const list=[...deep].sort((a,b)=>a-b);
  let done=0;
  for(const k of list){
    const st=states[k];
    if(!st||legalMoves(st,st.turn).length===0) continue;
    const r=await evalPosition(moves.slice(0,k).join(' '),k,DEEP_DEPTH);
    cps[k]=r.cp; bests[k]=r.best; seconds[k]=r.second;
    showRecap({busy:true,deep:true,done:++done,total:list.length});
  }
  const opening=bookOpening(moves);
  const blank=()=>({acc:[],n:0,brill:0,great:0,best:0,good:0,book:0,
                    inac:0,miss:0,mist:0,blun:0,
                    ph:{o:[],m:[],e:[]}});
  const st={w:blank(),b:blank()};
  const marks=[],drops=[];
  for(let i=0;i<moves.length;i++){
    const mover=(i%2===0)?'w':'b', s=st[mover];
    // Alles aus Sicht des Ziehenden rechnen
    const pct=v=>(mover==='w')?winPct(v):100-winPct(v);
    const before=pct(cps[i]), after=pct(cps[i+1]);
    const isBook=bookPrefix.has(encMoves(moves.slice(0,i+1)));
    const isBest=bests[i]&&moves[i].slice(0,4)===bests[i].slice(0,4);
    // Wer den von der Engine besten Zug spielt, verliert nichts. Ohne diese
    // Regel bestraft die stellungsweise Analyse ihre eigene Empfehlung, weil
    // die Bewertung zwischen zwei Suchen schwanken kann.
    const drop=isBest?0:Math.max(0,before-after);
    drops.push(drop);
    s.acc.push(moveAccuracy(drop)); s.n++;
    const gap=(seconds[i]!=null)?(before-pct(seconds[i])):0;   // wie einzigartig
    // Opfer: gibt der Zug Material her, das der Gegner nehmen kann?
    const to=parseSq(moves[i].slice(2,4));
    const taken=states[i].board[to.r][to.c];
    const net=(taken?(VALUE[taken[1]]||0):0)-exchangeGain(states[i+1],to.r,to.c);

    let q;
    if(isBook&&drop<10){ q={t:'Buchzug',s:'',c:'q-book'}; s.book++; }
    else if(isBest&&drop<2&&net<=-2&&before<97&&after>=45){
      q={t:'Glanzzug',s:'!!',c:'q-brill'}; s.brill++; }
    else if(isBest&&drop<2&&gap>=15&&before<95){
      q={t:'Starker Zug',s:'!',c:'q-great'}; s.great++; }
    else if(drop>=10&&before>=92&&after<60){
      q={t:'Verpasst',s:'?',c:'q-miss'}; s.miss++; }
    else{
      q=classify(drop);
      if(drop<2) s.best++; else if(drop<10) s.good++;
      else if(drop<20) s.inac++; else if(drop<30) s.mist++; else s.blun++;
    }
    marks.push(q);
    // Partiephase für die Teilgenauigkeit
    const phase=(i<opening.plies)?'o':(nonPawnMaterial(states[i])<=13?'e':'m');
    s.ph[phase].push(moveAccuracy(drop));
  }
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  // Schlüsselmomente: die drei größten Einbrüche
  const key=drops.map((d,i)=>({i,d})).filter(x=>x.d>=10)
    .sort((a,b)=>b.d-a.d).slice(0,3).sort((a,b)=>a.i-b.i);
  recapData={cps,bests,states,marks,drops,st,opening,key,
    accW:avg(st.w.acc),accB:avg(st.b.acc),
    phW:{o:avg(st.w.ph.o),m:avg(st.w.ph.m),e:avg(st.w.ph.e)},
    phB:{o:avg(st.b.ph.o),m:avg(st.b.ph.m),e:avg(st.b.ph.e)}};
  quality=marks;                       // Symbole in der Zugliste nachtragen
  renderMoves();
  recapRun=false;
  showRecap({});
}
function evalChart(cps){
  if(!cps||cps.length<2) return '';
  const W=390,H=70,cl=v=>Math.max(-800,Math.min(800,v));
  const x=i=>i*(W/(cps.length-1));
  const y=v=>H/2-(cl(v)/800)*(H/2-3);
  let d='M0 '+H/2;
  cps.forEach((v,i)=>{ d+=' L'+x(i).toFixed(1)+' '+y(v).toFixed(1); });
  const area=d+' L'+W+' '+H+' L0 '+H+' Z';
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#26262b"/>'+
    '<path d="'+area+'" fill="#fbf8f1"/>'+
    '<line x1="0" y1="'+H/2+'" x2="'+W+'" y2="'+H/2+'" stroke="#6b7280" stroke-width="1"/>'+
    '</svg>';
}
function showRecap(o){
  const box=document.getElementById('recap');
  if(!box) return;
  box.classList.add('on');

  document.getElementById('recapTitle').textContent=result||'Partie beendet';

              chart.innerHTML=''; tab.innerHTML=''; return; }
  if(!recapData){ sub.textContent=''; return; }
  const d=recapData;

  chart.onclick=(ev)=>{ const b=chart.getBoundingClientRect();

  const nm=c=>esc(names[c]||(c==='w'?'Weiß':'Schwarz'));
  const row=(lab,kw,kb,cls)=>(kw||kb)?'<div class="rrow"><span class="lab '+(cls||'')+
    '">'+lab+'</span><span class="num">'+kw+'</span><span class="num">'+kb+
    '</span></div>':'';
  const ph=(lab,a,b)=>'<div class="rrow"><span class="lab">'+lab+
    '</span><span class="num">'+(a?a.toFixed(0):'–')+'</span><span class="num">'+
    (b?b.toFixed(0):'–')+'</span></div>';
  const w=d.st.w, b=d.st.b;
  tab.innerHTML=
    '<div class="rrow head"><span></span><span class="num">'+nm('w')+
      '</span><span class="num">'+nm('b')+'</span></div>'+
    '<div class="rrow acc"><span class="lab">Genauigkeit</span>'+
      '<span class="num">'+d.accW.toFixed(1)+'</span>'+
      '<span class="num">'+d.accB.toFixed(1)+'</span></div>'+

function histHtml(){

  const when=t=>{
    const ms=parseInt(t,36)*60000;
    if(!ms) return '';
    const d=new Date(ms), z=n=>(n<10?'0':'')+n;
    return z(d.getDate())+'.'+z(d.getMonth()+1)+'. '+z(d.getHours())+':'+z(d.getMinutes());
  };

    '<div class="histrow"><span class="hn">'+esc(e.w)+' – '+esc(e.b)+'</span>'+

/* Rangliste: Punkte nach Schachart (Sieg 1, Remis 0,5), daraus die Quote */
function leaderboard(){
  const m=new Map();
  const add=(name,pts)=>{
    if(!name) return;
    const s=m.get(name)||{n:0,pts:0,w:0,d:0,l:0};
    s.n++; s.pts+=pts;
    if(pts===1) s.w++; else if(pts===0.5) s.d++; else s.l++;
    m.set(name,s);
  };
  for(const e of hist){
    add(e.w, e.r==='w'?1:e.r==='d'?0.5:0);
    add(e.b, e.r==='b'?1:e.r==='d'?0.5:0);
  }
  return [...m.entries()]
    .map(([name,s])=>({name,...s,rate:s.n?s.pts/s.n*100:0}))
    .sort((a,b)=>b.rate-a.rate || b.n-a.n || a.name.localeCompare(b.name));
}
function boardHtml(){
  const rows=leaderboard();
  if(!rows.length) return '';
  return '<div class="histttl">Rangliste nach Siegquote</div>'+
    rows.map((r,i)=>
      '<div class="histrow rank'+(r.n<3?' prov':'')+'">'+
      '<span class="hpos">'+(i+1)+'</span>'+
      '<span class="hn">'+esc(r.name)+'</span>'+
      '<span class="hr">'+r.rate.toFixed(0)+'%</span>'+
      '<span class="hmeta">'+r.n+' Partien · '+r.w+'S '+r.d+'R '+r.l+'N'+
      (r.n<3?' · noch wenige':'')+'</span></div>').join('');
}

// Der tatsächlich gespielte Zug als UCI (für den Vergleich mit dem besten)
function encPlayed(i){
  const h=history[i];
  return sqName(h.mv.from.r,h.mv.from.c)+sqName(h.mv.to.r,h.mv.to.c);
}
// Engine-Zug in lesbare Notation, bezogen auf die Stellung vor Zug i
function uciToSan(i,uci){
  const st=recapData.states[i]; if(!st) return uci;
  const from=parseSq(uci.slice(0,2)), to=parseSq(uci.slice(2,4));
  const promo=uci.length>4?uci[4].toUpperCase():null;
  const mv=legalMoves(st,st.turn).find(m=>m.from.r===from.r&&m.from.c===from.c
                                         &&m.to.r===to.r&&m.to.c===to.c);
  if(!mv) return uci;
  const t={...mv.to}; if(promo) t.promo=promo;
  return moveSAN(st,{from:mv.from,to:t},promo);
}

function dropMe(){ specs=specs.filter(s=>s.id!==myId); }

function takeSeat(col){
  if(!seatFree(col)){ lobbyMsg='Platz ist bereits belegt.'; renderLobby(); return; }
  const n=myName();
  if(!n){ lobbyMsg='Bitte zuerst einen Namen eingeben.'; renderLobby(); return; }
  dropMe();
  // Wechselt jemand die Farbe, wird der bisherige Platz frei – sonst könnte
  // ein Spieler beide Farben gleichzeitig belegen.
  const other=(col==='w')?'b':'w';
  if(seats[other]===myId){ seats[other]=''; names[other]=''; }
  seats[col]=myId; names[col]=n; mySide=col; lobbyMsg='';
  // Sitzt der Gegner noch in einer laufenden Partie, wird sie übernommen –
  // sonst (Partie beendet oder verwaist) beginnt eine frische Aufstellung.
  const takeover = phase==='run' && !!seats[col==='w'?'b':'w'];
  if(!takeover){
    newGameSilent(); phase='setup'; result='';
    const b=tcParts().base; clock={w:b,b:b}; clockAt=Date.now();
  }
  Sync.publish();
  applySide(); syncLobby();
  // Gleichzeitige Anmeldung: nach einem Abgleich prüfen, ob der Platz hält
  setTimeout(()=>{
    if(mySide===col && seats[col]!==myId){
      lobbyMsg='Ein anderer Spieler war schneller.'; leaveSeat(true);
    }
  },2500);
}

  const n=myName();
  if(!n){ lobbyMsg='Bitte zuerst einen Namen eingeben.'; renderLobby(); return; }
  dropMe();
  if(specs.length<MAXSPECS) specs.push({id:myId,name:n});
  mySide='v'; lobbyMsg=''; Sync.publish(); applySide(); syncLobby();

  if(mySide==='w'||mySide==='b'){
    if(seats[mySide]===myId){ seats[mySide]=''; names[mySide]=''; if(!lost) Sync.publish(); }
  } else if(mySide==='v'){ dropMe(); Sync.publish(); }
  mySide=null; applySide(); syncLobby();
}

}

/* ---------- PLC-Transport (zwei PCs, ein Brett) ----------
   Synchronisiert über eine STRING-Variable der Steuerung, gelesen/geschrieben
   über den B&R-AR-Webserver (goform/ReadWrite, Format aus PV_Access.js).
   Voraussetzung: response.asp liegt im Webverzeichnis (web\).
   Aktivierung mit ?plc in der URL; PV-Name via ?pv=... (Default gChessState). */
function setupPLC(){
  const params=new URLSearchParams(location.search);
  const pv=params.get('pv')||'gChessState';
  const G='/goform/ReadWrite';
  const body=(tail)=>'redirect=/response.asp&variable='+encodeURIComponent(pv)+tail;
  // Ohne Zeitgrenze kann ein hängender Zugriff die Abfrage dauerhaft blockieren
  function post(data,ms){
    const ac=new AbortController();
    const t=setTimeout(()=>ac.abort(),ms);
    return fetch(G,{method:'POST',body:data,signal:ac.signal})
      .finally(()=>clearTimeout(t));
  }
  /* Schreiben mit Wiederholung: Der zuletzt gewollte Stand bleibt vorgemerkt,
     bis die Steuerung ihn bestätigt. Solange etwas aussteht, wird kein
     empfangener Stand übernommen - er wäre älter als das, was wir senden. */
  let pending=null, sending=false, retry=null, pendingSince=0;
  // Der eigene Stand hat Vorrang - aber nur begrenzt. Klappt das Schreiben
  // laenger nicht, ist ein gemeinsamer Stand wichtiger als der eigene Zug.
  const holdsBack=()=>pending!==null && Date.now()-pendingSince<10000;
  async function flush(){
    if(sending||pending===null) return;
    sending=true;
    const val=pending;
    try{
      const r=await post(body('&value='+encodeURIComponent(val)+'&write=1'),6000);
      if(!r.ok) throw new Error('Schreiben '+r.status);
      if(pending===val) pending=null;         // erfolgreich übertragen
      Sync.last=val; Sync.fails=0;
    }catch(e){ Sync.fails++; }
    sending=false; renderWarn();
    if(pending!==null){                        // erneut versuchen, mit Abstand
      clearTimeout(retry);
      retry=setTimeout(flush,Math.min(4000,400*Math.pow(2,Math.min(Sync.fails,3))));
    }
  }
  function write(val){ if(pending===null) pendingSince=Date.now(); pending=val; flush(); }
  async function read(){
    const r=await post(body('&value=none&read=1'),4000);
    if(!r.ok) throw new Error('Lesen '+r.status);
    const t=(await r.text()).replace('<!-- B&R ASP Webserver -->','').trim();
    if(t.indexOf('<')>=0) throw new Error('Antwort ist keine Variable');
    return t;
  }
  Sync.transport={ send:write, confirms:true };
  Sync.ready=false;          // bis zum ersten Abgleich nichts überschreiben

  // Historie in einer eigenen, remanenten Variable (Vorgabe gChessHist)
  const hpv=params.get('hpv')||'gChessHist';
  const hbody=(tail)=>'redirect=/response.asp&variable='+encodeURIComponent(hpv)+tail;
  Hist.load=async()=>{
    const r=await fetch(G,{method:'POST',body:hbody('&value=none&read=1')});
    if(!r.ok) throw new Error('Lesen '+r.status);     // Variable fehlt -> 400
    return (await r.text()).replace('<!-- B&R ASP Webserver -->','').trim();
  };
  Hist.save=async(val)=>{
    const r=await fetch(G,{method:'POST',
      body:hbody('&value='+encodeURIComponent(val)+'&write=1')});
    if(!r.ok) throw new Error('Schreiben '+r.status);
  };
  Hist.name=hpv;

  const side=(params.get('side')||'').toLowerCase().charAt(0);
  applySide(); showLobby();

  let busy=false;
  async function poll(){
    if(busy) return;
    busy=true;
    try{
      const remote=await read();
      Sync.fails=0; renderWarn();
      // Eigener Stand noch nicht bestätigt? Dann nichts übernehmen.
      if(!holdsBack() && acceptState(remote)){
        if(!Sync.ready){
          Sync.last=remote;
          applyState(parseState(remote));   // Namen, Uhren, Modus mit übernehmen
          Sync.ready=true; renderLobby();
          // Platz aus der URL erst jetzt belegen – Stand ist bekannt
          if(side==='w'||side==='b') takeSeat(side);
          else if(side==='v') watchOnly();
        } else if(remote!==Sync.last){ Sync.receive(remote); }
      }
    }catch(e){ Sync.fails++; renderWarn(); }
    finally{ busy=false; }                  // sonst bliebe die Abfrage stehen
  }
  // Bei Störungen etwas Abstand halten, statt die Steuerung weiter zu bedrängen
  function loop(){
    poll().then(()=>{
      const wait=Sync.fails?Math.min(5000,1000*Math.pow(2,Math.min(Sync.fails,3))):1000;
      setTimeout(loop,wait);
    });
  }
  loop();
}

/* ---------- Server-Transport (LXC-Container) ----------
   Der Node-Server hält den Spielstand und schiebt Änderungen per
   Server-Sent Events sofort an alle Clients – kein Abfragen im Sekundentakt. */
/* ---------- Server-Transport ----------
   Zwei Gegenstellen: der Node-Server (schiebt Änderungen per Ereignisstrom)
   und die PHP-Fassung für klassisches Webhosting (wird abgefragt). Welche
   vorhanden ist, ermittelt detectApi(). */
const Api={base:'',ext:'',sse:true};
function apiUrl(name){ return Api.base+'api/'+name+Api.ext; }
async function detectApi(){
  const dir=location.pathname.replace(/[^/]*$/,'');   // erlaubt Unterordner
  for(const c of [{ext:'',sse:true},{ext:'.php',sse:false}]){
    try{
      const r=await fetch(dir+'api/health'+c.ext,{cache:'no-store'});
      if(!r.ok) continue;
      let j={}; try{ j=await r.json(); }catch(e){}
      Api.base=dir; Api.ext=c.ext; Api.sse=c.sse&&j.backend!=='php';
      return true;
    }catch(e){}
  }
  return false;
}

function setupServer(){
  // Wie beim PLC-Transport: erst bestätigt gilt als übertragen, mit
  // Zeitgrenze und Wiederholung.
  let pending=null, sending=false, retry=null, pendingSince=0;
  const holdsBack=()=>pending!==null && Date.now()-pendingSince<10000;
  async function flush(){
    if(sending||pending===null) return;
    sending=true;
    const val=pending;
    try{
      const ac=new AbortController();
      const t=setTimeout(()=>ac.abort(),6000);
      const r=await fetch(apiUrl('state'),{method:'POST',
        headers:{'Content-Type':'text/plain'},body:val,signal:ac.signal})
        .finally(()=>clearTimeout(t));
      if(!r.ok) throw new Error('Schreiben '+r.status);
      if(pending===val) pending=null;
      Sync.last=val; Sync.fails=0;
    }catch(e){ Sync.fails++; }
    sending=false; renderWarn();
    if(pending!==null){
      clearTimeout(retry);
      retry=setTimeout(flush,Math.min(4000,400*Math.pow(2,Math.min(Sync.fails,3))));
    }
  }
  Sync.transport={ send:(val)=>{ if(pending===null) pendingSince=Date.now();
                                 pending=val; flush(); }, confirms:true };
  Sync.ready=false;

  Hist.load=async()=>{
    const r=await fetch(apiUrl('hist'),{cache:'no-store'});
    if(!r.ok) throw new Error('Lesen '+r.status);
    return (await r.json()).s;
  };
  Hist.save=async(val)=>{
    const r=await fetch(apiUrl('hist'),
      {method:'POST',headers:{'Content-Type':'text/plain'},body:val});
    if(!r.ok) throw new Error('Schreiben '+r.status);
  };
  applySide(); showLobby();

  function apply(txt){
    if(holdsBack()) return;                 // eigener Stand noch nicht bestätigt
    if(!acceptState(txt)) return;
    if(!Sync.ready){                       // erster Stand: alles übernehmen
      Sync.last=txt; applyState(parseState(txt));
      Sync.ready=true; renderLobby();
    } else if(txt!==Sync.last){ Sync.receive(txt); }
  }
  let live=false;
  if(Api.sse){
    try{
      const es=new EventSource(apiUrl('events'));
      es.onmessage=(e)=>{ live=true; try{ apply(JSON.parse(e.data).s); }catch(err){} };
      es.onerror=()=>{ live=false; };      // Abfragen springt dann ein
    }catch(e){}
  }
  async function poll(){
    if(live&&Sync.ready) return;
    try{
      const ac=new AbortController();
      const t=setTimeout(()=>ac.abort(),4000);
      const r=await fetch(apiUrl('state'),{cache:'no-store',signal:ac.signal})
        .finally(()=>clearTimeout(t));
      if(!r.ok) throw new Error('Lesen '+r.status);
      apply((await r.json()).s);
      Sync.fails=0; renderWarn();
    }catch(e){ Sync.fails++; renderWarn(); }
  }
  poll();
  setInterval(poll,Api.sse?3000:1000);     // ohne Ereignisstrom öfter nachsehen
}

document.getElementById('seatW').addEventListener('click',()=>takeSeat('w'));
document.getElementById('seatB').addEventListener('click',()=>takeSeat('b'));
document.getElementById('seatV').addEventListener('click',watchOnly);
document.getElementById('resetSeats').addEventListener('click',resetSeats);
leaveBtn.addEventListener('click',()=>leaveSeat(false));

document.getElementById('newBtn').addEventListener('click',newGame);
document.getElementById('undoBtn').addEventListener('click',undo);
document.getElementById('undoYes').addEventListener('click',undoAccept);
document.getElementById('undoNo').addEventListener('click',undoDecline);
document.getElementById('flipBtn').addEventListener('click',()=>{flipped=!flipped;render();});

loadLocalHist();             // Hotseat: Historie aus dem Browser
newGame();                   // frisches Brett – Transport hängt noch nicht -> kein Publish

// Transport nach newGame() wählen, damit der Start keinen Reset an den Peer sendet
/* Betriebsart wählen: ?plc erzwingt die Steuerung, ?srv den Server, ?demo
   zwei Tabs. Ohne Angabe wird geprüft, ob ein Server antwortet – wird die
   Seite vom LXC-Container ausgeliefert, läuft sie damit ohne Zusatz-URL. */
const _q=location.search;
if(_q.indexOf('plc')>=0){
  setupPLC();
} else if(_q.indexOf('srv')>=0){
  setupServer();
} else if(_q.indexOf('demo')>=0 && 'BroadcastChannel' in window){
  const bc=new BroadcastChannel('chess-sync');
  Sync.transport={ send:(s)=>bc.postMessage(s) };
  bc.onmessage=(e)=>Sync.receive(e.data);
} else if(location.protocol!=='file:'){
  detectApi().then(found=>{ if(found) setupServer(); });   // sonst Hotseat
}
</script>
